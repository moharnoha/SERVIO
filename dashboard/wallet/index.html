<!DOCTYPE html>
<html lang="ar" dir="rtl" class="notranslate" translate="no"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="google" content="notranslate">
    <title>serviocmm - Optimized UI</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary-green: #2d5a1e;    
            --vibrant-green: #74a367;    
            --header-bg: rgba(243, 242, 242, 0.85);        
            --page-bg: #F3F2F2;          
            --text-main: #121212;        
            --text-muted: #5f6368;       
            --circle-empty: #FFFFFF;     
            --profile-icon: #9aa0a6;     
            --profile-bg: #e8eaed;       
            --border-subtle: rgba(0,0,0,0.06);
            --transition-main: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body { 
            margin: 0; padding: 0; 
            background-color: var(--page-bg); 
            direction: rtl !important; 
            -webkit-font-smoothing: antialiased;
            color: var(--text-main);
            font-family: 'Lexend', sans-serif;
            overscroll-behavior-y: contain;
            touch-action: pan-x pan-y;
        }

        header { 
            width: 100%; height: 72px; 
            background-color: var(--header-bg); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex; align-items: center; 
            padding: 0 20px;
            box-sizing: border-box;
            position: sticky; 
            top: 0; z-index: 1000;
            direction: rtl !important;
            border-bottom: 1px solid var(--border-subtle);
        }

        .header-content {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            position: relative;
        }

        @media (min-width: 481px) {
            .header-content {
                max-width: 100%;
                padding: 0 40px;
            }
        }

        .center-section { 
            display: flex; 
            align-items: center; 
            justify-content: flex-start;
            width: max-content;
        }

        .account-text {
            font-size: 18px; 
            font-weight: 700; 
            color: var(--text-main);
            letter-spacing: -0.3px; 
            white-space: nowrap;
        }

        .main-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 0 24px;
            box-sizing: border-box;
            background-color: var(--page-bg);
        }

        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 0;
        }

        .welcome-msg {
            margin-top: 25px;
            font-size: 16px;
            font-weight: 500;
            color: var(--text-muted);
        }

        #user-name {
            color: #000000;
            font-weight: 700;
        }

        .balance-card {
            width: 100%;
            background-color: #FFFFFF;
            border-radius: 16px;
            margin-top: 12px;
            padding: 24px;
            box-sizing: border-box;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .card-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .balance-amount {
            font-size: 44px;
            font-weight: 700;
            color: var(--text-main);
            margin-top: auto;
            display: flex;
            align-items: baseline;
            gap: 8px;
            letter-spacing: -1px;
            min-height: 50px;
        }

        .decimal-part {
            font-size: 20px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .currency-symbol {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
        }

        .card-icon-container {
            width: 42px;
            height: 42px;
        }

        .servio-logo-svg {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="center-section">
                <span class="account-text">wallet serviocmm</span>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="content-wrapper">
            <div class="welcome-msg">مرحبا بك <span id="user-name"></span></div>
            
            <div class="balance-card">
                <div class="top-row">
                    <div class="card-icon-container">
                        <svg class="servio-logo-svg" viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="deepGreen" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:#2d5a1e" />
                                    <stop offset="100%" style="stop-color:#1a3611" />
                                </linearGradient>
                                <linearGradient id="vibrantGreen" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:#74a367" />
                                    <stop offset="100%" style="stop-color:#5a854f" />
                                </linearGradient>
                                <mask id="whiteGap">
                                    <rect width="1000" height="800" fill="white" />
                                    <circle cx="350" cy="400" r="362" fill="black" />
                                </mask>
                            </defs>
                            <circle cx="350" cy="400" r="350" fill="url(#deepGreen)" />
                            <circle cx="650" cy="400" r="350" fill="url(#vibrantGreen)" mask="url(#whiteGap)" />
                            <g transform="rotate(-38 500 400)">
                                <rect x="290" y="390" width="75" height="145" rx="37.5" fill="#FFFFFF" />
                                <rect x="425" y="80" width="155" height="640" rx="77.5" fill="#FFFFFF" />
                                <rect x="640" y="445" width="75" height="145" rx="37.5" fill="#FFFFFF" />
                            </g>
                        </svg>
                    </div>
                    <div class="card-label">رصيد serviocmm</div>
                </div>
                
                <div class="balance-amount">
                    <span id="user-balance"></span>
                    <span class="currency-symbol" id="curr-sym" style="display:none;">USD</span>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
      import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
      import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBYNRiMneaU-d6FPMbCnjcWQBX4Tdg50zk",
        authDomain: "serviocmm-a65ed.firebaseapp.com",
        projectId: "serviocmm-a65ed",
        storageBucket: "serviocmm-a65ed.firebasestorage.app",
        messagingSenderId: "975373759034",
        appId: "1:975373759034:web:645cb5fb48772839453b03"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      const el = document.getElementById('user-balance');
      const sym = document.getElementById('curr-sym');
      const nameEl = document.getElementById('user-name');

      const updateUI = (balance, name) => {
        if(balance !== undefined && balance !== null) {
            const numVal = parseFloat(balance);
            let fullStr = numVal.toFixed(7);
            if (fullStr.indexOf('.') !== -1) {
                fullStr = fullStr.replace(/\.?0+$/, "");
            }
            const parts = fullStr.split('.');
            const integerPart = parseInt(parts[0]).toLocaleString();
            const decimalPart = parts[1] || '';
            
            if(el) {
                if(decimalPart) {
                    el.innerHTML = `${integerPart}<span class="decimal-part">.${decimalPart}</span>`;
                } else {
                    el.innerHTML = `${integerPart}`;
                }
            }
            if(sym) sym.style.display = 'inline-block';
        }
        if(name && nameEl) {
            nameEl.textContent = name;
        }
      };

      onAuthStateChanged(auth, (user) => {
        if (user) {
          const userDocRef = doc(db, "users", user.uid);
          onSnapshot(userDocRef, (docSnap) => {
            if (docSnap.exists()) {
              const data = docSnap.data();
              updateUI(data.balance, data.name);
            }
          });
        }
      });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl" class="notranslate" translate="no"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="google" content="notranslate">
    <title>serviocmm - Optimized UI</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary-green: #2d5a1e;    
            --vibrant-green: #74a367;    
            --header-bg: rgba(243, 242, 242, 0.85);        
            --page-bg: #F3F2F2;          
            --text-main: #121212;        
            --text-muted: #5f6368;       
            --circle-empty: #FFFFFF;     
            --profile-icon: #9aa0a6;     
            --profile-bg: #e8eaed;       
            --border-subtle: rgba(0,0,0,0.06);
            --transition-main: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body { 
            margin: 0; padding: 0; 
            background-color: var(--page-bg); 
            direction: rtl !important; 
            -webkit-font-smoothing: antialiased;
            color: var(--text-main);
            font-family: 'Lexend', sans-serif;
        }

        header { 
            width: 100%; height: 72px; 
            background-color: var(--header-bg); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex; align-items: center; 
            padding: 0 20px;
            box-sizing: border-box;
            position: sticky; 
            top: 0; z-index: 1000;
            direction: rtl !important;
            border-bottom: 1px solid var(--border-subtle);
        }

        .header-content {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        @media (min-width: 481px) {
            .header-content {
                max-width: 100%;
                padding: 0 40px;
            }
        }

        .right-section { 
            display: flex; 
            align-items: center; 
            flex-shrink: 0;
            z-index: 2;
            cursor: pointer;
        }
        
        .center-section { 
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex; 
            align-items: center; 
            justify-content: center;
            width: max-content;
        }

        .account-text {
            font-size: 18px; 
            font-weight: 700; 
            color: var(--text-main);
            letter-spacing: -0.3px; 
            white-space: nowrap;
        }

        .back-arrow-svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: var(--text-main);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .left-section {
            width: 24px; 
        }

        .main-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 0 24px;
            box-sizing: border-box;
            background-color: var(--page-bg);
        }

        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
        }

        .sub-header-icons {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="right-section" onclick="history.back()">
                <svg class="back-arrow-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </div>

            <div class="center-section">
                <span class="account-text">store</span>
            </div>

            <div class="left-section">
            </div>
        </div>
    </header>

    <div class="main-container">
        <div class="content-wrapper">
            <div class="sub-header-icons">
            </div>
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl" class="notranslate" translate="no"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="google" content="notranslate">
    <title>serviocmm - Optimized UI</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --primary-green: #2F5822;    
            --vibrant-green: #74a367;    
            --header-bg: rgba(243, 242, 242, 0.85); 
            --page-bg: rgba(243, 242, 242, 0.85); 
            --text-main: #000000;        
            --text-muted: #8E8E93;       
            --border-subtle: rgba(0,0,0,0.06);
            --primary-blue: #007AFF;
        }

        /* ضبط الارتفاع لضمان بقاء العناصر في واجهة واحدة */
        html, body { 
            height: 100%;
            margin: 0; padding: 0; 
            background-color: var(--page-bg); 
            overflow: hidden; /* منع التمرير الكلي للحفاظ على الواجهة الواحدة */
        }

        body { 
            direction: rtl !important; 
            -webkit-font-smoothing: antialiased;
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* الهيدر الآن غير ثابت (يتحرك مع الصفحة) */
        header { 
            width: 100%; height: 72px; 
            background-color: var(--header-bg); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex; align-items: center; 
            padding: 0 20px;
            box-sizing: border-box;
            position: relative; /* غير ثابت */
            z-index: 1000;
            border-bottom: 1px solid var(--border-subtle);
        }

        .header-content {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .right-section { cursor: pointer; display: flex; align-items: center; }
        .center-section { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
        .account-text { font-size: 18px; font-weight: 700; color: #121212; white-space: nowrap; }
        .back-arrow-svg { width: 24px; height: 24px; fill: none; stroke: #121212; stroke-width: 2.5; }

        /* الحاوية الرئيسية تأخذ المساحة المتبقية */
        .main-container { 
            flex: 1;
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            justify-content: space-between; /* دفع العناصر للأسفل */
            padding-bottom: 20px;
            box-sizing: border-box;
            overflow-y: auto; /* السماح بالتمرير داخل الحاوية فقط إذا لزم الأمر */
        }
        
        .services-grid {
            width: 100%;
            max-width: 500px; 
            display: flex;
            flex-direction: column;
        }

        .order-details-header { padding: 15px 20px 8px 20px; }
        .section-header { font-size: 13px; color: #6e6e73; text-align: right; }

        .field { 
            background-color: #FFFFFF;
            width: 92%;
            margin: 0 auto 10px auto;
            border-radius: 12px;
            display: flex;
            align-items: center;
            padding: 14px 16px;
            min-height: 48px;
            box-sizing: border-box;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }

        .field .label { font-size: 16px; min-width: 90px; text-align: right; }
        .input-box { flex: 1; display: flex; align-items: center; }
        .input-box input, .input-box span { 
            width: 100%; border: none; outline: none; background: none; 
            font-size: 16px; color: #000; text-align: left; font-family: 'Cairo';
        }

        #category { color: var(--primary-blue); }

        .header-subtitle {
            font-size: 13px; color: #8E8E93;
            padding: 5px 20px; text-align: right;
        }

        /* دفع قسم السعر والزر لأسفل الصفحة */
        .bottom-actions-container {
            width: 100%;
            max-width: 500px;
            margin-top: auto; /* يدفع هذا القسم للأسفل */
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .price-container { 
            background: #ffffff; 
            padding: 14px 16px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-radius: 12px;
            width: 92%;
            margin: 0 auto;
            box-sizing: border-box;
        }
        
        .price-value { font-size: 17px; font-weight: 600; font-family: 'Lexend'; }

        #payBtn { 
            width: 92%; 
            margin: 0 auto;
            padding: 16px; 
            border-radius: 12px; 
            border: none; 
            background-color: #000000; 
            color: #ffffff; 
            font-size: 17px; 
            font-weight: 600; 
            cursor: pointer;
            position: relative;
        }

        /* لودر الزر */
        .exact-8-spinner {
            position: absolute; right: 15px; top: 50%;
            transform: translateY(-50%) scale(0.5);
            display: none; width: 44px; height: 44px;
        }
        .exact-8-spinner div {
            position: absolute; width: 6px; height: 14px;
            background: #ffffff; border-radius: 10px; left: 19px;
            transform-origin: 3px 22px; animation: spinner-fade 0.8s linear infinite;
        }
        @keyframes spinner-fade { 0% { opacity: 1; } 100% { opacity: 0.3; } }
        .loading .exact-8-spinner { display: block; }
        .loading #btn-text { opacity: 0; }

        #status-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--page-bg); z-index: 9999;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="right-section" onclick="history.back()">
                <svg class="back-arrow-svg" viewBox="0 0 24 24">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </div>
            <div class="center-section">
                <span class="account-text">social media marketing</span>
            </div>
            <div class="left-section" style="width:24px;"></div>
        </div>
    </header>

    <div class="main-container">
        <div class="services-grid">
            <div class="order-details-header">
                <div class="section-header">تفاصيل الطلب</div>
            </div>

            <div class="field">
                <label class="label">الرابط</label>
                <div class="input-box">
                    <input id="platformLink" type="url" placeholder="أدخل الرابط هنا">
                </div>
            </div>

            <div class="field" onclick="goToCategory()" style="cursor:pointer">
                <label class="label">الخدمة</label>
                <div class="input-box">
                    <span id="category">اختر خدمة...</span>
                </div>
                <i class="fas fa-chevron-left" style="font-size: 12px; color: #C7C7CC;"></i>
            </div>

            <div class="field">
                <label class="label">الكمية</label>
                <div class="input-box">
                    <input id="quantity" type="text" inputmode="numeric" placeholder="0">
                </div>
            </div>

            <div class="header-subtitle">
                سيتم البدء في التنفيذ فوراً بعد الدفع.
            </div>
        </div>

        <div class="bottom-actions-container">
            <div class="price-container">
                <span class="price-label">إجمالي المستحق</span>
                <span class="price-value" id="display-price">USD 0.00</span>
            </div>

            <button id="payBtn">
                <span id="btn-text">تأكيد الطلب والدفع</span>
                <div class="exact-8-spinner">
                    <div></div><div></div><div></div><div></div>
                    <div></div><div></div><div></div><div></div>
                </div>
            </button>
        </div>
    </div>

    <div id="status-overlay">
        </div>

    <script>
        // دالة تحديث السعر والتنسيق
        function updatePrice() {
            const qtyInput = document.getElementById("quantity");
            const priceDisplay = document.getElementById("display-price");
            const unitPrice = parseFloat(localStorage.getItem("service_price")) || 0;
            
            let val = qtyInput.value.replace(/[^0-9]/g, '');
            if (val !== "") {
                const total = unitPrice * parseInt(val);
                priceDisplay.innerText = `USD ${total.toLocaleString()}`;
                qtyInput.value = parseInt(val).toLocaleString();
            } else {
                priceDisplay.innerText = "USD 0.00";
            }
        }

        document.getElementById("quantity").oninput = updatePrice;
        function goToCategory() { window.location.href = "../Category/"; }

        // محاكاة الضغط للزر
        document.getElementById("payBtn").onclick = function() {
            this.classList.add('loading');
            this.disabled = true;
            // منطق Firebase هنا
        };
    </script>
</body>
</html>

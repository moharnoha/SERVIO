<!DOCTYPE html>
<html lang="ar" dir="rtl" class="notranslate" translate="no"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="google" content="notranslate">
    <title>serviocmm - Optimized UI</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --primary-green: #2F5822;    
            --vibrant-green: #74a367;    
            --header-bg: #F2F2F7;        
            --page-bg: #F2F2F7;          
            --text-main: #000000;        
            --text-muted: #8E8E93;       
            --circle-empty: #FFFFFF;     
            --profile-icon: #9aa0a6;     
            --profile-bg: #e8eaed;       
            --border-subtle: rgba(0,0,0,0.06);
            --transition-main: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --accent-green: #34C759; 
            --card-white: #ffffff;
            --bg-light: #f8fbff; --border-gray: #E5E5EA; --text-dark: #1a202c;
            --primary-blue: #007AFF; --accent: #000000; --success-green: #34C759;
            --error-red: #FF3B30; --bg-gray: #E5E5EA; --header-green: #FFFFFF;
        }

        body { 
            margin: 0; padding: 0; 
            background-color: var(--page-bg); 
            direction: rtl !important; 
            -webkit-font-smoothing: antialiased;
            color: var(--text-main);
            font-family: 'Cairo', 'Inter', sans-serif;
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            display: block;
        }

        header { 
            width: 100%; height: 72px; 
            background-color: var(--header-bg); 
            display: flex; align-items: center; 
            padding: 0 20px;
            box-sizing: border-box;
            position: relative; 
            z-index: 1000;
            direction: rtl !important;
            border-bottom: 1px solid var(--border-subtle);
        }

        .header-content {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        @media (min-width: 481px) {
            .header-content {
                max-width: 100%;
                padding: 0 40px;
            }
        }

        .right-section { 
            display: flex; 
            align-items: center; 
            flex-shrink: 0;
            z-index: 2;
            cursor: pointer;
        }
        
        .center-section { 
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex; 
            align-items: center; 
            justify-content: center;
            width: max-content;
        }

        .account-text {
            font-size: 18px; 
            font-weight: 700; 
            color: #121212;
            letter-spacing: -0.3px; 
            white-space: nowrap;
        }

        .back-arrow-svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #121212;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .left-section {
            width: 24px; 
        }

        .main-container { 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding-top: 10px;
        }
        
        .services-grid {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 500px; 
            box-sizing: border-box;
        }

        .order-details-header {
            padding: 15px 20px 8px 20px; 
            width: 100%;
            box-sizing: border-box;
            display: flex;
            align-items: center;
        }

        .section-header {
            font-size: 13px;
            font-weight: 400;
            color: #6e6e73;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
            text-align: right;
            width: 100%;
        }

        .field { 
            background-color: #FFFFFF;
            width: 92%;
            margin: 0 auto 10px auto;
            border-radius: 12px;
            position: relative; 
            display: flex;
            align-items: center;
            padding: 14px 16px;
            min-height: 48px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
            box-sizing: border-box;
        }

        .field .label { 
            font-size: 16px; 
            font-weight: 400; 
            color: #000000; 
            min-width: 110px;
            text-align: right;
        }
        
        .input-box { 
            flex: 1;
            display: flex; 
            align-items: center; 
            background: transparent; 
            padding: 0;
            transition: all 0.2s;
        }

        .input-box input, .input-box span { 
            flex: 1; 
            border: none; 
            outline: none !important; 
            background: none; 
            font-size: 16px; 
            color: #000; 
            text-align: left;
            padding-left: 5px;
            font-family: 'Cairo', sans-serif;
        }

        #platformLink::placeholder, #quantity::placeholder {
            color: #C7C7CC;
        }

        #category {
            color: var(--primary-blue);
            font-weight: 400;
        }

        .content-area { 
            padding: 10px 16px; 
            width: 100%; 
            box-sizing: border-box;
        }

        .header-subtitle {
            font-size: 13px;
            color: #8E8E93;
            padding: 10px 20px 15px 20px;
            line-height: 1.4;
            text-align: right;
        }

        .bottom-actions {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .price-container { 
            background: #ffffff; 
            padding: 14px 16px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-radius: 12px;
            width: 92%;
            margin: 0 auto;
            box-sizing: border-box;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }
        
        .price-label { 
            font-size: 16px; 
            font-weight: 400; 
            color: #000;
        }
        .price-value { 
            font-size: 17px; 
            font-weight: 600; 
            color: #000; 
            font-family: 'Lexend', sans-serif; 
        }

        #payBtn { 
            width: 92%; 
            margin: 0 auto 40px auto;
            padding: 14px; 
            border-radius: 12px; 
            border: none; 
            background-color: #000000; 
            color: #ffffff; 
            font-size: 17px; 
            font-weight: 600; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: transform 0.1s;
        }

        #payBtn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
        
        .exact-8-spinner {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%) scale(0.5);
            display: none;
            width: 44px;
            height: 44px;
        }
        .exact-8-spinner div {
            position: absolute;
            width: 6px;
            height: 14px;
            background: #ffffff;
            border-radius: 10px;
            left: 19px;
            top: 0;
            transform-origin: 3px 22px;
            animation: spinner-fade 0.8s linear infinite;
        }
        @keyframes spinner-fade { 0% { opacity: 1; } 100% { opacity: 0.3; } }
        .loading .exact-8-spinner { display: block; }

        #status-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #F2F2F7;
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .status-icon-box {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .status-icon-box.success { background-color: #34C759; }
        .status-icon-box.error { background-color: #FF3B30; }
        .status-icon-box i { color: white; font-size: 40px; }

        .status-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
        .status-sub { font-size: 16px; color: #8E8E93; }

        #nav-loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            display: none;
            z-index: 99999;
        }
    </style>
</head>
<body class="notranslate" translate="no">

    <div id="status-overlay">
        <div class="status-icon-box" id="status-icon-bg">
            <i class="fas" id="status-icon"></i>
        </div>
        <div class="status-title" id="status-title"></div>
        <div class="status-sub" id="status-sub"></div>
    </div>

    <div id="nav-loader"></div>

    <header>
        <div class="header-content">
            <div class="right-section" onclick="history.back()">
                <svg class="back-arrow-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </div>
            <div class="center-section">
                <span class="account-text">social media marketing</span>
            </div>
            <div class="left-section"></div>
        </div>
    </header>

    <div class="main-container" id="page-content">
        <div class="services-grid">
            
            <div class="order-details-header">
                <div class="section-header" data-ar="تفاصيل الطلب" data-en="Order Details">تفاصيل الطلب</div>
            </div>

            <div class="field" id="link-field">
                <label class="label" data-i18n="link_label">الرابط</label>
                <div class="input-box" id="link-box">
                    <input id="platformLink" type="url" required data-i18n-placeholder="link_placeholder" placeholder="أدخل الرابط هنا">
                </div>
            </div>

            <div class="field" id="category-field" onclick="goToCategory()" style="cursor:pointer">
                <label class="label" data-i18n="category_label">الخدمة</label>
                <div class="input-box" id="category-box">
                    <span id="category" data-i18n="choose_service">اختر خدمة...</span>
                </div>
                <i class="fas fa-chevron-left" style="font-size: 14px; color: #C7C7CC;"></i>
            </div>

            <div class="field" id="qty-field">
                <label class="label" data-i18n="quantity_label">الكمية</label>
                <div class="input-box" id="qty-box">
                    <input id="quantity" type="text" inputmode="numeric" required data-i18n-placeholder="quantity_placeholder" placeholder="0" maxlength="13">
                </div>
            </div>

            <div class="header-subtitle" data-ar="يرجى التأكد من صحة الرابط والكمية قبل إتمام الطلب. سيتم البدء في التنفيذ فوراً." data-en="Please ensure the link and quantity are correct before confirming. Execution starts immediately.">
                يرجى التأكد من صحة الرابط والكمية قبل إتمام الطلب. سيتم البدء في التنفيذ فوراً.
            </div>
            
            <div class="content-area">
                <div class="bottom-actions">
                    <div class="price-container">
                        <span class="price-label" data-i18n="total_due">إجمالي المستحق</span>
                        <span class="price-value" id="display-price">USD 0.00</span>
                    </div>

                    <button id="payBtn">
                        <span id="btn-text" data-i18n="confirm_order">تأكيد الطلب والدفع</span>
                        <div class="exact-8-spinner">
                            <div></div><div></div><div></div><div></div>
                            <div></div><div></div><div></div><div></div>
                        </div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const translations = {
            ar: {
                order_details: "تفاصيل الطلب",
                link_label: "الرابط",
                link_placeholder: "أدخل الرابط هنا",
                category_label: "الخدمة",
                choose_service: "اختر خدمة...",
                quantity_label: "الكمية",
                quantity_placeholder: "0",
                min: "الأدنى:",
                max: "الأقصى:",
                total_due: "إجمالي المستحق",
                confirm_order: "تأكيد الطلب والدفع",
                success_msg: "تم تفعيل الطلب",
                success_sub: "نشط الان …",
                balance_err: "رصيد غير كافٍ",
                balance_sub: "يرجى شحن حسابك للمتابعة",
                error_msg: "حدث خطأ",
                error_sub: "يرجى المحاولة لاحقاً",
                err_link_req: "يرجى إدخال الرابط",
                err_cat_req: "يرجى اختيار الخدمة",
                err_qty_req: "يرجى إدخال الكمية"
            },
            en: {
                order_details: "Order Details",
                link_label: "Link",
                link_placeholder: "Enter link here",
                category_label: "Service",
                choose_service: "Choose service...",
                quantity_label: "Quantity",
                quantity_placeholder: "0",
                min: "Min:",
                max: "Max:",
                total_due: "Total Due",
                confirm_order: "Confirm & Pay",
                success_msg: "Order Activated",
                success_sub: "Active now ...",
                balance_err: "Insufficient Balance",
                balance_sub: "Please top up to continue",
                error_msg: "Error Occurred",
                error_sub: "Please try again later",
                err_link_req: "Link required",
                err_cat_req: "Service required",
                err_qty_req: "Quantity required"
            }
        };

        const scriptURL = "https://script.google.com/macros/s/AKfycbxJ0oupWVWSzpDrnEELES_4xlX-wWB05dgr7SFuww9JmjfFJkRj-nCrqWCUnmkSgABI/exec";

        function applyTranslations() {
            const lang = localStorage.getItem('pref_lang') || 'ar';
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) el.innerText = translations[lang][key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (translations[lang][key]) el.placeholder = translations[lang][key];
            });
            document.querySelectorAll('.section-header').forEach(header => {
                header.innerText = header.getAttribute(`data-${lang}`);
            });
            document.querySelectorAll('.header-subtitle').forEach(sub => {
                sub.innerText = sub.getAttribute(`data-${lang}`);
            });
        }

        function clearErrors() {}

        function formatNumber(num) { 
            if (!num || isNaN(num)) return "0";
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); 
        }

        function updatePriceAndFormat() {
            const qtyInput = document.getElementById("quantity");
            const unitPrice = parseFloat(localStorage.getItem("service_price")) || 0;
            let rawValue = qtyInput.value.replace(/[^0-9]/g, '');
            if (rawValue.length > 10) rawValue = rawValue.substring(0, 10);
            const total = unitPrice * (parseInt(rawValue) || 0);
            let displayVal = total % 1 === 0 ? total.toString() : total.toFixed(8).replace(/\.?0+$/, "");
            document.getElementById("display-price").innerText = `USD ${displayVal}`;
            if (rawValue !== "") qtyInput.value = formatNumber(rawValue); 
            else qtyInput.value = "";
        }

        function updateUI() {
            applyTranslations();
            const lang = localStorage.getItem('pref_lang') || 'ar';
            const chosenService = localStorage.getItem('chosen_service');
            document.getElementById("category").innerText = chosenService || translations[lang].choose_service;
            updatePriceAndFormat();
        }

        function goToCategory() { location.href = `../Category/`; }
        window.addEventListener('load', updateUI);
        window.addEventListener('pageshow', updateUI);
        window.addEventListener('storage', updateUI);
        
        document.getElementById("quantity").oninput = updatePriceAndFormat;
        document.getElementById("platformLink").oninput = function() {
            this.value = this.value.replace(/[^\x00-\x7F]/g, "");
        };

        function showFinalStatus(message, subMessage, isSuccess) {
            const overlay = document.getElementById('status-overlay');
            const titleEl = document.getElementById('status-title');
            const subEl = document.getElementById('status-sub');
            const iconBg = document.getElementById('status-icon-bg');
            const icon = document.getElementById('status-icon');
            
            titleEl.innerText = message;
            subEl.innerText = subMessage;
            
            if (isSuccess) {
                iconBg.className = 'status-icon-box success';
                icon.className = 'fas fa-check';
            } else {
                iconBg.className = 'status-icon-box error';
                icon.className = 'fas fa-times';
            }
            
            overlay.style.display = 'flex';
            
            setTimeout(() => {
                window.location.href = "../../dashboard/";
            }, 2500);
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, increment, collection, serverTimestamp, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBYNRiMneaU-d6FPMbCnjcWQBX4Tdg50zk", 
            authDomain: "serviocmm-a65ed.firebaseapp.com", 
            projectId: "serviocmm-a65ed", 
            storageBucket: "serviocmm-a65ed.firebasestorage.app", 
            messagingSenderId: "975373759034", 
            appId: "1:975373759034:web:645cb5fb48772839453b03" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentUser = null;

        onAuthStateChanged(auth, async (user) => { 
            if (user) {
                currentUser = user;
                localStorage.setItem("user_email", user.email);
            } 
        });

        document.getElementById("payBtn").onclick = async function() {
            const lang = localStorage.getItem('pref_lang') || 'ar';
            const t = translations[lang];
            if (!currentUser) return;
            
            const link = document.getElementById("platformLink").value.trim();
            const email = currentUser.email; 
            const qtyRaw = document.getElementById("quantity").value.replace(/,/g, '');
            const qtyNum = parseInt(qtyRaw) || 0;
            const unitPrice = parseFloat(localStorage.getItem("service_price")) || 0;
            const finalCharge = parseFloat((unitPrice * qtyNum).toFixed(8));
            const service = localStorage.getItem("chosen_service");
            const minAllowed = parseInt(localStorage.getItem("service_min")) || 0;
            const maxAllowed = parseInt(localStorage.getItem("service_max")) || Infinity;

            if (!link || !service || qtyNum <= 0 || qtyNum < minAllowed || qtyNum > maxAllowed) return;

            this.classList.add('loading');
            this.disabled = true;

            try {
                const userRef = doc(db, "users", currentUser.uid);
                await runTransaction(db, async (transaction) => {
                    const userSnap = await transaction.get(userRef);
                    if (!userSnap.exists()) throw "User does not exist";
                    const currentBalance = parseFloat(userSnap.data().balance || 0);
                    if (currentBalance < (finalCharge - 0.000000001)) throw "INSUFFICIENT_BALANCE";
                    
                    transaction.update(userRef, { 
                        balance: increment(-finalCharge), 
                        total_spend: increment(finalCharge) 
                    });
                    
                    const transRef = doc(collection(db, "transactions"));
                    transaction.set(transRef, { 
                        amount: `-${finalCharge.toFixed(8).replace(/\.?0+$/, "")}`, 
                        description: "" + service, 
                        status: "Active", 
                        link: link, 
                        quantity: qtyNum, 
                        timestamp: serverTimestamp(), 
                        userId: currentUser.uid, 
                        userEmail: email 
                    });
                });
                
                try { 
                    fetch(scriptURL, { 
                        method: "POST", 
                        mode: "no-cors", 
                        body: JSON.stringify({ 
                            platformLink: link, 
                            category: service, 
                            quantity: qtyNum, 
                            charge: finalCharge.toFixed(8).replace(/\.?0+$/, ""), 
                            gmail: email, 
                            status: "Active" 
                        }) 
                    }); 
                } catch (e) {}
                
                showFinalStatus(t.success_msg, t.success_sub, true);
            } catch (e) {
                this.classList.remove('loading');
                this.disabled = false;
                if (e === "INSUFFICIENT_BALANCE") showFinalStatus(t.balance_err, t.balance_sub, false);
                else showFinalStatus(t.error_msg, t.error_sub, false);
            }
        };
    </script>
</body>
</html>

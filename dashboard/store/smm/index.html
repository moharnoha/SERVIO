<!DOCTYPE html>
<html lang="ar" dir="rtl" class="notranslate" translate="no"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="google" content="notranslate">
    <title>serviocmm - Optimized UI</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --primary-green: #2d5a1e;    
            --vibrant-green: #74a367;    
            --header-bg: rgba(243, 242, 242, 0.85);        
            --page-bg: #F3F2F2;          
            --text-main: #121212;        
            --text-muted: #5f6368;       
            --circle-empty: #FFFFFF;     
            --profile-icon: #9aa0a6;     
            --profile-bg: #e8eaed;       
            --border-subtle: rgba(0,0,0,0.06);
            --transition-main: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --accent-green: #386E2C; 
            --card-white: #ffffff;
            --step-color: #4E793F;
        }

        body { 
            margin: 0; padding: 0; 
            background-color: var(--page-bg); 
            direction: rtl !important; 
            -webkit-font-smoothing: antialiased;
            color: var(--text-main);
            font-family: 'Cairo', 'Lexend', sans-serif;
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            display: block;
        }

        header { 
            width: 100%; height: 72px; 
            background-color: var(--header-bg); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex; align-items: center; 
            padding: 0 20px;
            box-sizing: border-box;
            position: relative; 
            z-index: 1000;
            direction: rtl !important;
            border-bottom: 1px solid var(--border-subtle);
        }

        .secondary-header {
            width: 100%;
            background-color: #ffffff;
            padding: 15px 20px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 15px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .header-content {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        @media (min-width: 481px) {
            .header-content {
                max-width: 100%;
                padding: 0 40px;
            }
        }

        .right-section { 
            display: flex; 
            align-items: center; 
            flex-shrink: 0;
            z-index: 2;
            cursor: pointer;
        }
        
        .center-section { 
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex; 
            align-items: center; 
            justify-content: center;
            width: max-content;
        }

        .account-text {
            font-size: 18px; 
            font-weight: 700; 
            color: var(--text-main);
            letter-spacing: -0.3px; 
            white-space: nowrap;
        }

        .back-arrow-svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: var(--text-main);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .left-section {
            width: 24px; 
        }

        .step-circle {
            width: 32px;
            height: 32px;
            border: 2px solid var(--step-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--step-color);
            font-weight: 600;
            font-size: 16px;
            flex-shrink: 0;
        }

        .header-text-group {
            display: flex;
            flex-direction: column;
            text-align: right;
        }

        .main-step-title {
            font-family: 'Cairo', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: #121212;
            line-height: 1.2;
        }

        .sub-step-title {
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: #5f6368;
            margin-top: 2px;
        }

        .main-container { 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        
        .services-grid {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
        }

        .content-area { 
            padding: 20px; 
            width: 100%; 
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        
        .form-grid { 
            display: flex; 
            flex-direction: column; 
            gap: 12px;
        }
        
        .field { position: relative; }

        .field .label { 
            font-size: 13px; 
            font-weight: 700; 
            color: #1d1d1f; 
            margin-bottom: 4px; 
            display: block; 
            text-align: right;
        }
        
        .input-box { 
            display: flex; 
            align-items: center; 
            background: #ffffff; 
            border: 1px solid #d2d2d7; 
            border-radius: 12px;
            padding: 8px 16px; 
            min-height: 44px; 
            box-sizing: border-box;
        }
        
        .input-box input, .input-box span { 
            flex: 1; 
            border: none; 
            outline: none; 
            background: none; 
            font-size: 15px; 
            font-weight: 500; 
            color: #1d1d1f; 
            width: 100%; 
            text-align: right;
            font-family: 'Cairo', sans-serif;
        }
        
        .field-error-msg {
            font-size: 11px;
            color: #ff3b30;
            font-weight: 600;
            margin-top: 2px;
            display: none;
            text-align: right;
        }

        .limit-hint { 
            font-size: 11px; 
            color: #6e6e73; 
            margin-top: 4px; 
            font-weight: 500; 
            display: none; 
            gap: 12px; 
        }

        .bottom-actions {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 0;
            padding-bottom: 30px;
        }

        .price-container { 
            background: #ffffff; 
            padding: 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-radius: 12px;
            border: 1px solid #e5e5e7;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        
        .price-label { font-size: 15px; font-weight: 600; color: #6e6e73; }
        .price-value { font-size: 20px; font-weight: 800; color: #1d1d1f; font-family: 'Lexend', sans-serif; }

        #payBtn { 
            width: 100%; 
            padding: 14px; 
            border-radius: 12px; 
            border: none; 
            background-color: #000000; 
            color: #ffffff; 
            font-size: 16px; 
            font-weight: 700; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative;
            box-sizing: border-box;
        }
        
        .exact-8-spinner {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%) scale(0.5);
            display: none;
            width: 44px;
            height: 44px;
        }
        .exact-8-spinner div {
            position: absolute;
            width: 6px;
            height: 14px;
            background: #ffffff;
            border-radius: 10px;
            left: 19px;
            top: 0;
            transform-origin: 3px 22px;
            animation: spinner-fade 0.8s linear infinite;
        }
        @keyframes spinner-fade { 0% { opacity: 1; } 100% { opacity: 0.3; } }
        .loading .exact-8-spinner { display: block; }

        #status-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        .status-icon-box {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .status-icon-box.success { background-color: #e8f5e9; color: #4caf50; }
        .status-icon-box.error { background-color: #ffebee; color: #f44336; }
        .status-icon-box i { font-size: 40px; }
        .status-title { font-size: 22px; font-weight: 800; margin-bottom: 8px; font-family: 'Cairo', sans-serif; }
        .status-sub { font-size: 16px; color: #5f6368; font-family: 'Cairo', sans-serif; }

        #nav-loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.19);
            backdrop-filter: blur(4px);
            display: none;
            z-index: 99999;
        }
        html[dir="ltr"] .secondary-header { justify-content: flex-end; }
        html[dir="ltr"] .header-text-group { text-align: left; }
    </style>
</head>
<body class="notranslate" translate="no">

    <div id="status-overlay">
        <div class="status-icon-box" id="status-icon-bg">
            <i class="fas" id="status-icon"></i>
        </div>
        <div class="status-title" id="status-title"></div>
        <div class="status-sub" id="status-sub"></div>
    </div>

    <div id="nav-loader"></div>

    <header>
        <div class="header-content">
            <div class="right-section" onclick="history.back()">
                <svg class="back-arrow-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </div>
            <div class="center-section">
                <span class="account-text">social media marketing</span>
            </div>
            <div class="left-section"></div>
        </div>
    </header>

    <div class="secondary-header">
        <div class="step-circle">1</div>
        <div class="header-text-group">
            <span class="main-step-title" data-ar="إدخال المعلومات" data-en="Enter Information">إدخال المعلومات</span>
            <span class="sub-step-title" data-ar="يرجى ملء الحقول التالية" data-en="Please fill in the following fields">يرجى ملء الحقول التالية</span>
        </div>
    </div>

    <div class="main-container" id="page-content">
        <div class="services-grid">
            <div class="content-area">
                <div class="form-grid">
                    <div class="field" id="link-field">
                        <label class="label" data-i18n="link_label">الرابط</label>
                        <div class="input-box" id="link-box">
                            <input id="platformLink" data-i18n-placeholder="link_placeholder" placeholder="أدخل الرابط هنا">
                        </div>
                        <div class="field-error-msg" id="link-error"></div>
                    </div>

                    <div class="field" id="category-field" onclick="goToCategory()" style="cursor:pointer">
                        <label class="label" data-i18n="category_label">الفئة المختارة</label>
                        <div class="input-box" id="category-box" style="justify-content: space-between;">
                            <span id="category" data-i18n="choose_service">اضغط لاختيار خدمة...</span>
                            <i class="fas fa-chevron-left" style="font-size: 14px; color: #c1c1c6;"></i>
                        </div>
                        <div class="field-error-msg" id="category-error"></div>
                    </div>

                    <div class="field" id="qty-field">
                        <label class="label" data-i18n="quantity_label">الكمية المطلوبة</label>
                        <div class="input-box" id="qty-box">
                            <input id="quantity" type="text" inputmode="numeric" data-i18n-placeholder="quantity_placeholder" placeholder="0" maxlength="13">
                        </div>
                        <div class="limit-hint" id="limit-hint">
                            <span id="min-hint"></span>
                            <span id="max-hint"></span>
                        </div>
                        <div class="field-error-msg" id="qty-error"></div>
                    </div>
                </div>

                <div class="bottom-actions">
                    <div class="price-container">
                        <span class="price-label" data-i18n="total_due">إجمالي المستحق</span>
                        <span class="price-value" id="display-price">USD 0.00</span>
                    </div>
                    <button id="payBtn">
                        <span id="btn-text" data-i18n="confirm_order">تأكيد الطلب والدفع</span>
                        <div class="exact-8-spinner">
                            <div></div><div></div><div></div><div></div>
                            <div></div><div></div><div></div><div></div>
                        </div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const translations = {
            ar: {
                link_label: "الرابط", link_placeholder: "أدخل الرابط هنا",
                category_label: "الفئة المختارة", choose_service: "اضغط لاختيار خدمة...",
                quantity_label: "الكمية المطلوبة", quantity_placeholder: "أدخل الكمية",
                min: "الأدنى:", max: "الأقصى:", total_due: "إجمالي المستحق",
                confirm_order: "تأكيد الطلب والدفع", success_msg: "تم تفعيل الطلب",
                success_sub: "نشط الان …", balance_err: "عذراً، رصيدك الحالي غير كافٍ لإتمام هذه العملية",
                balance_sub: "قم بتعبئة الحساب", error_msg: "نعتذر، حدث خطأ غير متوقع. يرجى المحاولة لاحقاً",
                error_sub: "يرجى المحاولة لاحقاً", err_link_req: "يرجى إدخال الرابط أولاً",
                err_cat_req: "يرجى اختيار الخدمة المطلوبة", err_qty_req: "يرجى إدخال كمية صحيحة"
            },
            en: {
                link_label: "Link", link_placeholder: "Enter link here",
                category_label: "Selected Category", choose_service: "Click to choose a service...",
                quantity_label: "Requested Quantity", quantity_placeholder: "Enter quantity",
                min: "Min:", max: "Max:", total_due: "Total Due",
                confirm_order: "Confirm & Pay", success_msg: "Order Activated",
                success_sub: "Active now ...", balance_err: "Sorry, your current balance is insufficient",
                balance_sub: "Please top up your account", error_msg: "Sorry, an unexpected error occurred",
                error_sub: "Please try again later", err_link_req: "Please enter the link",
                err_cat_req: "Please select a service", err_qty_req: "Please enter a valid quantity"
            }
        };

        const scriptURL = "https://script.google.com/macros/s/AKfycbxJ0oupWVWSzpDrnEELES_4xlX-wWB05dgr7SFuww9JmjfFJkRj-nCrqWCUnmkSgABI/exec";

        function applyTranslations() {
            const lang = localStorage.getItem('pref_lang') || 'ar';
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) el.innerText = translations[lang][key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (translations[lang][key]) el.placeholder = translations[lang][key];
            });
            document.querySelectorAll('[data-ar]').forEach(el => {
                el.innerText = el.getAttribute(`data-${lang}`);
            });
        }

        function clearErrors() {
            document.querySelectorAll('.field-error-msg').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.input-box').forEach(el => {
                el.style.borderColor = '#d2d2d7';
                el.style.backgroundColor = '#ffffff';
            });
        }

        function setFieldError(fieldId, errorMsg) {
            const errorEl = document.getElementById(`${fieldId}-error`);
            const boxEl = document.getElementById(`${fieldId}-box`);
            if (errorEl) { errorEl.innerText = errorMsg; errorEl.style.display = 'block'; }
            if (boxEl) { 
                boxEl.style.borderColor = '#ff3b30';
                boxEl.style.backgroundColor = 'transparent'; 
            }
        }

        function formatNumber(num) { 
            if (!num || isNaN(num)) return "0";
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); 
        }

        function updatePriceAndFormat() {
            const qtyInput = document.getElementById("quantity");
            const unitPrice = parseFloat(localStorage.getItem("service_price")) || 0;
            let rawValue = qtyInput.value.replace(/[^0-9]/g, '');
            if (rawValue.length > 10) rawValue = rawValue.substring(0, 10);
            const total = unitPrice * (parseInt(rawValue) || 0);
            let displayVal = total % 1 === 0 ? total.toString() : total.toFixed(8).replace(/\.?0+$/, "");
            document.getElementById("display-price").innerText = `USD ${displayVal}`;
            if (rawValue !== "") qtyInput.value = formatNumber(rawValue); 
            else qtyInput.value = "";
            clearErrors();
        }

        function updateUI() {
            applyTranslations();
            const lang = localStorage.getItem('pref_lang') || 'ar';
            const chosenService = localStorage.getItem('chosen_service');
            const minVal = localStorage.getItem("service_min");
            const maxVal = localStorage.getItem("service_max");
            
            document.getElementById("category").innerText = chosenService || translations[lang].choose_service;
            
            const limitHint = document.getElementById('limit-hint');
            if (chosenService && minVal && maxVal) {
                document.getElementById('min-hint').innerHTML = `<b>${translations[lang].min}</b> ${formatNumber(minVal)}`;
                document.getElementById('max-hint').innerHTML = `<b>${translations[lang].max}</b> ${formatNumber(maxVal)}`;
                limitHint.style.display = 'flex';
            } else {
                limitHint.style.display = 'none';
            }
            updatePriceAndFormat();
        }

        function goToCategory() { location.href = `../Category/`; }
        window.addEventListener('load', updateUI);
        window.addEventListener('pageshow', updateUI);
        window.addEventListener('storage', updateUI);
        document.getElementById("quantity").oninput = updatePriceAndFormat;
        document.getElementById("platformLink").oninput = function() {
            this.value = this.value.replace(/[^\x00-\x7F]/g, "");
            clearErrors();
        };

        function showFinalStatus(message, subMessage, isSuccess) {
            const overlay = document.getElementById('status-overlay');
            const titleEl = document.getElementById('status-title');
            const subEl = document.getElementById('status-sub');
            const iconBg = document.getElementById('status-icon-bg');
            const icon = document.getElementById('status-icon');
            titleEl.innerText = message;
            subEl.innerText = subMessage;
            if (isSuccess) { iconBg.className = 'status-icon-box success'; icon.className = 'fas fa-check'; }
            else { iconBg.className = 'status-icon-box error'; icon.className = 'fas fa-times'; }
            overlay.style.display = 'flex';
            setTimeout(() => { history.back(); }, 2500);
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, increment, collection, serverTimestamp, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBYNRiMneaU-d6FPMbCnjcWQBX4Tdg50zk", 
            authDomain: "serviocmm-a65ed.firebaseapp.com", 
            projectId: "serviocmm-a65ed", 
            storageBucket: "serviocmm-a65ed.firebasestorage.app", 
            messagingSenderId: "975373759034", 
            appId: "1:975373759034:web:645cb5fb48772839453b03" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentUser = null;

        onAuthStateChanged(auth, async (user) => { if (user) { currentUser = user; localStorage.setItem("user_email", user.email); } });

        document.getElementById("payBtn").onclick = async function() {
            clearErrors();
            const lang = localStorage.getItem('pref_lang') || 'ar';
            const t = translations[lang];
            if (!currentUser) return;
            const link = document.getElementById("platformLink").value;
            const email = currentUser.email; 
            const qtyRaw = document.getElementById("quantity").value.replace(/,/g, '');
            const qtyNum = parseInt(qtyRaw) || 0;
            const unitPrice = parseFloat(localStorage.getItem("service_price")) || 0;
            const finalCharge = parseFloat((unitPrice * qtyNum).toFixed(8));
            const service = localStorage.getItem("chosen_service");
            const minAllowed = parseInt(localStorage.getItem("service_min")) || 0;
            const maxAllowed = parseInt(localStorage.getItem("service_max")) || Infinity;

            let hasError = false;
            if (!link) { setFieldError('link', t.err_link_req); hasError = true; }
            if (!service) { setFieldError('category', t.err_cat_req); hasError = true; }
            if (qtyNum <= 0 || qtyNum < minAllowed || qtyNum > maxAllowed) { setFieldError('qty', t.err_qty_req); hasError = true; }
            if (hasError) return;

            this.classList.add('loading');
            this.disabled = true;

            try {
                const userRef = doc(db, "users", currentUser.uid);
                await runTransaction(db, async (transaction) => {
                    const userSnap = await transaction.get(userRef);
                    if (!userSnap.exists()) throw "User does not exist";
                    const currentBalance = parseFloat(userSnap.data().balance || 0);
                    if (currentBalance < (finalCharge - 0.000000001)) throw "INSUFFICIENT_BALANCE";
                    transaction.update(userRef, { balance: increment(-finalCharge), total_spend: increment(finalCharge) });
                    const transRef = doc(collection(db, "transactions"));
                    transaction.set(transRef, { amount: `-${finalCharge.toFixed(8).replace(/\.?0+$/, "")}`, description: "" + service, status: "Active", link: link, quantity: qtyNum, timestamp: serverTimestamp(), userId: currentUser.uid, userEmail: email });
                });
                try { fetch(scriptURL, { method: "POST", mode: "no-cors", body: JSON.stringify({ platformLink: link, category: service, quantity: qtyNum, charge: finalCharge, gmail: email, status: "Active" }) }); } catch (e) {}
                showFinalStatus(t.success_msg, t.success_sub, true);
            } catch (e) {
                this.classList.remove('loading');
                this.disabled = false;
                if (e === "INSUFFICIENT_BALANCE") showFinalStatus(t.balance_err, t.balance_sub, false);
                else showFinalStatus(t.error_msg, t.error_sub, false);
            }
        };
    </script>
</body>
</html>

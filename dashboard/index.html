<!DOCTYPE html>
<html lang="ar" dir="rtl" class="notranslate" translate="no"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="google" content="notranslate">
    <title>serviocmm - Optimized UI</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            /* لوحة ألوان مستوحاة من الشعار مع تحسينات الشركات الكبرى */
            --primary-green: #2d5a1e;    
            --vibrant-green: #74a367;    
            --header-bg: rgba(243, 242, 242, 0.85);        
            --page-bg: #F3F2F2;          
            --text-main: #121212;        
            --text-muted: #5f6368;       
            --circle-empty: #FFFFFF;     
            --profile-icon: #9aa0a6;     
            --profile-bg: #e8eaed;       
            --border-subtle: rgba(0,0,0,0.06);
            --transition-main: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body { 
            margin: 0; padding: 0; 
            background-color: var(--page-bg); 
            direction: rtl !important; 
            -webkit-font-smoothing: antialiased;
            color: var(--text-main);
            font-family: 'Lexend', sans-serif;
        }

        header { 
            width: 100%; height: 72px; 
            background-color: var(--header-bg); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex; align-items: center; 
            padding: 0 20px;
            box-sizing: border-box;
            position: sticky; 
            top: 0; z-index: 1000;
            direction: rtl !important;
            border-bottom: 1px solid var(--border-subtle);
        }

        .header-content {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        @media (min-width: 481px) {
            .header-content {
                max-width: 100%;
                padding: 0 40px;
            }
        }

        .right-section { 
            display: flex; 
            align-items: center; 
            flex-shrink: 0;
            z-index: 2;
        }
        
        .center-section { 
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex; 
            align-items: center; 
            justify-content: center;
            width: auto;
        }

        .account-text {
            font-size: 23px; 
            font-weight: 700; 
            color: var(--text-main);
            letter-spacing: -0.6px; 
        }

        .profile-icon-svg {
            width: 32px; 
            height: 32px; 
            fill: var(--profile-icon); 
            transition: var(--transition-main);
        }

        .main-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 0 24px;
            box-sizing: border-box;
            background-color: var(--page-bg);
        }

        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 0; /* إزالة الحشو بالكامل ليبدأ مباشرة تحت الهيدر */
        }

        .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between; /* توزيع احترافي للمساحة */
            width: 100%;
            margin-bottom: 0px; /* تقليص المسافة بين النص العلوي والرصيد */
            padding-top: 5px; /* مسافة بسيطة جداً للفصل بين الهيدر والمحتوى */
        }

        .balance-label-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .balance-label {
            font-size: 15.5px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .chevron-down-svg {
            width: 13px;
            height: 13px;
            fill: none;
            stroke: var(--text-muted);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .balance-amount {
            font-size: 52px; /* تكبير بسيط للمبلغ كمركز اهتمام */
            font-weight: 600; /* زيادة الوزن للبروز */
            color: var(--text-main);
            line-height: 1.1;
            display: flex;
            align-items: baseline;
            gap: 10px;
            letter-spacing: -2px;
            font-variant-numeric: tabular-nums;
            margin-bottom: 0px; /* إزالة الهامش السفلي للرصيد */
        }

        .currency-symbol {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0;
            opacity: 0.7; /* تقليل البروز لجعل الرقم هو الأساس */
        }

        .card-icon-container {
            width: 46px; /* توحيد القياس العالمي */
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .servio-logo-svg {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

        .circles-section {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 5px; /* تقليص المسافة جداً بين الرصيد والأيقونات */
            padding: 10px 0;
        }

        .circle-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px; 
            flex: 1;
            cursor: pointer;
            transition: var(--transition-main);
        }

        .circle-item:active {
            transform: scale(0.94); /* استجابة لمسية رشيقة */
        }

        .empty-circle {
            width: 68px; /* توحيد الحجم العالمي للأدوات */
            height: 68px;
            border-radius: 50%; /* إرجاع البطاقات دائرية */
            background-color: var(--circle-empty);
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .deposit-circle {
            width: 68px;
            height: 68px;
            border-radius: 50%; /* إرجاع البطاقات دائرية */
            background: linear-gradient(135deg, var(--primary-green), var(--vibrant-green));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(45, 90, 30, 0.2);
            border: none;
        }

        .circle-svg-icon {
            width: 30px;
            height: 30px;
        }

        .dots-icon {
            font-size: 26px;
            color: var(--text-main);
            font-weight: 800;
            letter-spacing: 1px;
            line-height: 0;
            margin-bottom: 6px;
        }

        .circle-label {
            font-size: 14px;
            font-weight: 600; 
            color: #1a1a1a;
            letter-spacing: -0.1px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="right-section">
                <svg class="profile-icon-svg" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <clipPath id="circleView">
                            <circle cx="512" cy="512" r="512" />
                        </clipPath>
                    </defs>
                    <circle cx="512" cy="512" r="512" fill="var(--profile-bg)" />
                    <g clip-path="url(#circleView)">
                        <circle cx="512" cy="380" r="170.7" fill="var(--profile-icon)"/>
                        <path d="M100 880c0-140 150-200 412-200s412 60 412 200v150H100V880z" fill="var(--profile-icon)"/>
                    </g>
                </svg>
            </div>

            <div class="center-section">
                <span class="account-text">ServioCmm</span>
            </div>

            <div style="width: 32px;"></div>
        </div>
    </header>

    <main class="main-container">
        <div class="content-wrapper">
            <div class="top-row">
                <div class="balance-label-wrapper">
                    <div class="balance-label">الرصيد المتاح</div>
                    <svg class="chevron-down-svg" viewBox="0 0 24 24">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </div>
                <div class="card-icon-container">
                    <svg class="servio-logo-svg" viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="deepGreen" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#2d5a1e;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#1a3611;stop-opacity:1" />
                            </linearGradient>
                            <linearGradient id="vibrantGreen" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#74a367;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#5a854f;stop-opacity:1" />
                            </linearGradient>
                            <mask id="whiteGap">
                                <rect width="1000" height="800" fill="white" />
                                <circle cx="350" cy="400" r="362" fill="black" />
                            </mask>
                        </defs>
                        <circle cx="350" cy="400" r="350" fill="url(#deepGreen)" />
                        <circle cx="650" cy="400" r="350" fill="url(#vibrantGreen)" mask="url(#whiteGap)" fill-opacity="0.95" />
                        <g transform="rotate(-38 500 400)">
                            <rect x="290" y="390" width="75" height="145" rx="37.5" fill="#FFFFFF" />
                            <rect x="425" y="80" width="155" height="640" rx="77.5" fill="#FFFFFF" />
                            <rect x="640" y="445" width="75" height="145" rx="37.5" fill="#FFFFFF" />
                        </g>
                    </svg>
                </div>
            </div>
            <div class="balance-amount">0,00 <span class="currency-symbol">USD</span></div>
            
            <div class="circles-section">
                <div class="circle-item">
                    <div class="deposit-circle">
                        <svg class="circle-svg-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 5V19M5 12H19" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <span class="circle-label">إيداع</span>
                </div>
                <div class="circle-item">
                    <div class="empty-circle">
                        <svg class="circle-svg-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M16 11V7C16 4.79086 14.2091 3 12 3C9.79086 3 8 4.79086 8 7V11M5 9H19L20 21H4L5 9Z" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <span class="circle-label">متجر</span>
                </div>
                <div class="circle-item">
                    <div class="empty-circle">
                        <svg class="circle-svg-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="5" width="18" height="14" rx="3" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M3 10H21" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M7 15H7.01" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <span class="circle-label">المحفظة</span>
                </div>
                <div class="circle-item">
                    <div class="empty-circle">
                        <svg class="circle-svg-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="5" cy="12" r="1.5" fill="#1a1a1a"/>
                            <circle cx="12" cy="12" r="1.5" fill="#1a1a1a"/>
                            <circle cx="19" cy="12" r="1.5" fill="#1a1a1a"/>
                        </svg>
                    </div>
                    <span class="circle-label">مزيد</span>
                </div>
            </div>
        </div>
    </main>

</body>
</html>

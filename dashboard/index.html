        .detail-value { font-weight: 700; font-size: 12px; color: #1e293b; text-align: left; line-height: 1.4; }
        .detail-value.is-active { color: #000000; background: #f1f5f9; padding: 2px 8px; border-radius: 6px; border: 1px solid #E2E7F0; }
        .detail-value.is-activated { color: #000000; background: #f1f5f9; padding: 2px 8px; border-radius: 6px; border: 1px solid #E2E7F0; }
        .detail-value.is-rejected { color: #000000; background: #f1f5f9; padding: 2px 8px; border-radius: 6px; border: 1px solid #E2E7F0; }

        .page-wrapper { width: 100%; display: flex; flex-direction: column; align-items: center; min-height: 100%; background-color: var(--platform-bg); overflow: visible; }
        
        .view-more-link {
            color: #2E5822;
            font-size: 14px;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 8px;
        }
        .view-more-link:active { background: #f1f5f9; }

        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        .loader-spin {
            animation: spin 0.8s linear infinite !important;
        }
    </style>
</head>
<body class="notranslate">

    <div id="app-init-loader">
        <div class="loader-right-side">

            <a href="https://postimg.cc/dk8H8qw8" target="_blank">

        </div>
    </div>

    <div id="global-loading">
        <div class="ios-loader"></div>
    </div>

    <div class="page-wrapper">
        <div class="bottom-header">
            <div class="bottom-header-content">
            </div>
        </div>

        <div class="new-header-container">
            <div class="new-header-content">
                <div class="shortcuts-scroll-wrapper">
                    <a href="smm-services/" class="shortcut-item simulate-link">
                        <div class="icon-box">

                        <span class="shortcut-label" id="txt-smm"></span>
                    </a>
                    <a href="deposit/" class="shortcut-item simulate-link">
                        <div class="icon-box">
                            <svg class="icon-svg-deposit" viewBox="0 0 24 24"><path d="M19 3H5c-1.11 0-2 .89-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.11-.9-2-2-2zM11 7h2v4h4v2h-4v4h-2v-4H7v-2h4V7z"/></svg>
                        </div>
                        <span class="shortcut-label" id="txt-deposit"></span>
                    </a>
                    <a href="menu/" class="shortcut-item simulate-link">
                        <div class="icon-box">
                            <svg class="icon-svg-menu" viewBox="0 0 24 24"><path d="M4 10.5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5-.67-1.5-1.5-1.5zm0-6c-.83 0-1.5.67-1.5 1.5S3.17 7.5 4 7.5 5.5 6.83 5.5 6 4.83 4.5 4 4.5zm0 12c-.83 0-1.5.68-1.5 1.5s.68 1.5 1.5 1.5 1.5-.68 1.5-1.5-.67-1.5-1.5-1.5zM7 19h14v-2H7v2zm0-6h14v-2H7v2zm0-8v2h14V5H7z"/></svg>
                        </div>
                        <span class="shortcut-label" id="txt-menu"></span>
                    </a>
                    <div class="shortcut-item simulate-link" onclick="handleLogout()">
                        <div class="icon-box">
                            <svg class="icon-svg-logout" viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                        </div>
                        <span class="shortcut-label" id="txt-logout"></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="transactions-header">
            <div class="transactions-content">
                <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:15px; flex-shrink:0;">
                    <div class="section-title" id="txt-trans-title" style="font-size:16px; font-weight:800"></div>
                    <a class="view-more-link" id="txt-view-more" onclick="showAllTransactions()"></a>
                </div>
                
                <div id="trans-container" class="trans-list"></div>
            </div>
        </div>
    </div>

    <div id="trans-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header-accent">
                <div class="modal-header-inner">
                    <div class="modal-close-icon" onclick="closeModal()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </div>
                    <h3 class="modal-title-text" id="modal-title"></h3>
                    <div style="width: 38px;"></div>
                </div>
            </div>
            <div class="modal-body">
                <div id="modal-content" class="trans-list"></div>
            </div>
        </div>
    </div>

    <div id="detail-modal" class="detail-modal-overlay" onclick="closeDetail()">
        <div class="detail-card" onclick="event.stopPropagation()">
            <div id="detail-content"></div>
            <button class="modal-close-btn" style="width: 100%; background: #f1f5f9; color: #475569; border: none; padding: 12px 0; border-radius: 14px; font-weight: 700; font-size: 14px; margin-top:20px; cursor:pointer;" onclick="closeDetail()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="transform: scaleX(-1);"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, query, where, orderBy, limit, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBYNRiMneaU-d6FPMbCnjcWQBX4Tdg50zk", authDomain: "serviocmm-a65ed.firebaseapp.com", 
            projectId: "serviocmm-a65ed", storageBucket: "serviocmm-a65ed.firebasestorage.app", 
            messagingSenderId: "975373759034", appId: "1:975373759034:web:645cb5fb48772839453b03" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let smmTransactions = [];
        let depositTransactions = [];
        const DISPLAY_LIMIT = 20;

        /* SPLASH SCREEN SYSTEM (STABLE & SECURE) */
        let splashTimer = null;
        const splashTimeoutDuration = 8000; // 8 Seconds fallback

        const hideInitialLoader = () => {
            const loader = document.getElementById('app-init-loader');
            if (loader && loader.style.display !== 'none') {
                if(splashTimer) clearTimeout(splashTimer);
                loader.style.transition = 'opacity 0.4s ease';
                loader.style.opacity = '0';
                setTimeout(() => { 
                    loader.style.display = 'none'; 
                }, 400);
            }
        };

        splashTimer = setTimeout(() => {
            console.warn("Splash screen timed out. Forcing display.");
            hideInitialLoader();
        }, splashTimeoutDuration);

        const cached = JSON.parse(localStorage.getItem('user_cache') || '{}');
        
        function formatBalanceVal(val) {
            if (val === undefined || val === null || isNaN(val)) return "0.00";
            return Number(val).toFixed(2);
        };

        window.showDetails = (title, amount, status, date, fullDesc, quantity, code, username) => {
            const isAr = (localStorage.getItem('pref_lang') || 'ar') === 'ar';
            const statusLow = status.toLowerCase();
            const statusStyle = statusLow === 'activated' ? 'is-activated' : (statusLow === 'active' ? 'is-active' : (statusLow === 'rejected' ? 'is-rejected' : ''));
            const statusDisplay = statusLow === 'activated' ? (isAr ? 'مكتمل' : 'Completed') : (statusLow === 'active' ? (isAr ? 'قيد الانتظار' : 'Pending') : (statusLow === 'rejected' ? (isAr ? 'مرفوض' : 'Rejected') : status));

            let html = `
                <div style="text-align:center; margin-bottom:20px;">
                    <div style="font-weight:900; font-size:20px; color:#1e293b; direction:ltr">${amount}</div>
                    <div style="font-size:12px; color:#94a3b8; margin-top:5px;">${title}</div>
                </div>
                <div class="detail-row">
                    <span class="detail-label">${isAr ? 'نوع العملية' : 'Transaction Type'}</span>
                    <span class="detail-value">${amount.startsWith('+') ? fullDesc : (isAr ? 'شراء: ' : 'Purchase: ') + fullDesc}</span>
                </div>
                ${quantity ? `<div class="detail-row"><span class="detail-label">${isAr ? 'الكمية' : 'Quantity'}</span><span class="detail-value" style="direction:ltr">${quantity}</span></div>` : ''}
                ${code ? `<div class="detail-row"><span class="detail-label">${isAr ? 'الكود' : 'Code'}</span><span class="detail-value" style="direction:ltr">${code}</span></div>` : ''}
                ${username ? `<div class="detail-row"><span class="detail-label">${isAr ? 'المستخدم' : 'Username'}</span><span class="detail-value" style="direction:ltr">${username}</span></div>` : ''}
                <div class="detail-row">
                    <span class="detail-label">${isAr ? 'الحالة' : 'Status'}</span>
                    <span class="detail-value ${statusStyle}">${statusDisplay}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">${isAr ? 'التاريخ' : 'Date'}</span>
                    <span class="detail-value" style="direction:ltr; font-size:11px">${date}</span>
                </div>
            `;
            
            document.getElementById('detail-content').innerHTML = html;
            document.getElementById('detail-modal').style.display = 'flex';
        };

        window.closeDetail = () => {
            document.getElementById('detail-modal').style.display = 'none';
        };

        window.showAllTransactions = () => {
            const isAr = (localStorage.getItem('pref_lang') || 'ar') === 'ar';
            const allTrans = [...smmTransactions, ...depositTransactions].sort((a, b) => {
                const dateA = a.timestamp?.toDate ? a.timestamp.toDate() : new Date(a.timestamp);
                const dateB = b.timestamp?.toDate ? b.timestamp.toDate() : new Date(b.timestamp);
                return dateB - dateA;
            });
            
            document.getElementById('modal-title').innerText = isAr ? 'سجل العمليات' : 'Transaction History';

            if (allTrans.length === 0) {
                document.getElementById('modal-content').innerHTML = `<div class="empty-state"><p class="empty-state-text">${isAr ? 'لا توجد عمليات مسجلة' : 'No transactions recorded'}</p></div>`;
            } else {
                let html = '';
                allTrans.forEach(t => {
                    const isDep = depositTransactions.includes(t);
                    const status = (t.status || 'active').toLowerCase();
                    let statusLabel = "";
                    if (status === 'active') {
                        statusLabel = `<span class="status-inline">${isAr ? 'قيد الانتظار' : 'Pending'}</span>`;
                    } else if (status === 'activated') {
                        statusLabel = `<span class="status-inline" style="color:#10b981">${isAr ? 'مكتمل' : 'Completed'}</span>`;
                    } else if (status === 'rejected') {
                        statusLabel = `<span class="status-inline" style="color:#ef4444">${isAr ? 'مرفوض' : 'Rejected'}</span>`;
                    }

                    const date = t.timestamp ? (t.timestamp.toDate ? t.timestamp.toDate() : new Date(t.timestamp)) : new Date();
                    const dateStr = `${date.getFullYear()}/${date.getMonth()+1}/${date.getDate()} - ${date.toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit', hour12:true})}`;
                    const displayTitle = isDep ? (isAr ? 'إيداع في الحساب' : 'Account Deposit') : (isAr ? 'شراء خدمة رقمية' : 'Digital Service');
                    const amountLabel = isDep ? `+${t.amount} USD` : `${t.amount} USD`;

                    html += `
                        <div class="trans-item" style="margin-bottom:12px;" onclick="showDetails('${displayTitle.replace(/'/g, "\\'")}', '${amountLabel}', '${t.status}', '${dateStr}', '${(t.description || displayTitle).replace(/'/g, "\\'")}', '${t.quantity || ""}', '${t.code || ""}', '${t.username || ""}')">
                            <div style="display:flex; flex-direction:column">
                                <div style="display:flex; align-items:center;">
                                    <span style="font-weight:700; font-size:13px;">${displayTitle}</span>
                                    ${statusLabel}
                                </div>
                                <span class="trans-date">${dateStr}</span>
                            </div>
                            <span class="trans-val">${amountLabel}</span>
                        </div>`;
                });
                document.getElementById('modal-content').innerHTML = html;
            }
            document.getElementById('trans-modal').style.display = 'flex';
        };

        window.closeModal = () => {
            document.getElementById('trans-modal').style.display = 'none';
        };

        const renderUI = () => {
            const container = document.getElementById('trans-container');
            const isAr = (localStorage.getItem('pref_lang') || 'ar') === 'ar';
            const allTrans = [...smmTransactions, ...depositTransactions].sort((a, b) => {
                const dateA = a.timestamp?.toDate ? a.timestamp.toDate() : new Date(a.timestamp);
                const dateB = b.timestamp?.toDate ? b.timestamp.toDate() : new Date(b.timestamp);
                return dateB - dateA;
            }).slice(0, DISPLAY_LIMIT);
            
            if (allTrans.length === 0) {
                container.innerHTML = `<div class="empty-state"><p class="empty-state-text">${isAr ? 'لا توجد معاملات' : 'No transactions'}</p></div>`;
                return;
            }

            let html = "";
            allTrans.forEach(t => {
                const isDep = depositTransactions.includes(t);
                const status = (t.status || 'active').toLowerCase();
                let statusLabel = "";
                if (status === 'active') statusLabel = `<span class="status-inline">${isAr ? 'قيد الانتظار' : 'Pending'}</span>`;
                else if (status === 'activated') statusLabel = `<span class="status-inline" style="color:#10b981">${isAr ? 'مكتمل' : 'Completed'}</span>`;
                else if (status === 'rejected') statusLabel = `<span class="status-inline" style="color:#ef4444">${isAr ? 'مرفوض' : 'Rejected'}</span>`;

                const date = t.timestamp ? (t.timestamp.toDate ? t.timestamp.toDate() : new Date(t.timestamp)) : new Date();
                const dateStr = `${date.getFullYear()}/${date.getMonth()+1}/${date.getDate()} - ${date.toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit', hour12:true})}`;
                const displayTitle = isDep ? (isAr ? 'إيداع في الحساب' : 'Account Deposit') : (isAr ? 'شراء خدمة رقمية' : 'Digital Service');
                const amountLabel = isDep ? `+${t.amount} USD` : `${t.amount} USD`;

                html += `
                    <div class="trans-item" onclick="showDetails('${displayTitle.replace(/'/g, "\\'")}', '${amountLabel}', '${t.status}', '${dateStr}', '${(t.description || displayTitle).replace(/'/g, "\\'")}', '${t.quantity || ""}', '${t.code || ""}', '${t.username || ""}')">
                        <div style="display:flex; flex-direction:column">
                            <div style="display:flex; align-items:center;">
                                <span style="font-weight:700; font-size:13px;">${displayTitle}</span>
                                ${statusLabel}
                            </div>
                            <span class="trans-date">${dateStr}</span>
                        </div>
                        <span class="trans-val">${amountLabel}</span>
                    </div>`;
            });
            container.innerHTML = html;
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.currentEmail = user.email;
                onSnapshot(doc(db, "users", user.uid), (snap) => {
                    if (snap.exists()) {
                        const d = snap.data();
                        const bal = d.balance || 0; 
                        window.currentName = d.fullName || d.name || "User";
                        
                        // Update UI Balances
                        document.getElementById('header-balance-val').innerText = formatBalanceVal(bal);
                        
                        const fireLanguage = d.selected_language || "ar";
                        localStorage.setItem('pref_lang', fireLanguage);
                        
                        localStorage.setItem('user_cache', JSON.stringify({name: window.currentName, email: user.email, balance: bal}));
                        localStorage.setItem('hide_email', d.hide_email === "true");
                        localStorage.setItem('hide_username', d.hide_username === "true");
                        
                        window.sync(); // Refresh Header UI
                        hideInitialLoader();
                    }
                });

                const qSmm = query(collection(db, "transactions"), where("userId", "==", user.uid), orderBy("timestamp", "desc"));
                onSnapshot(qSmm, (snap) => {
                    smmTransactions = snap.docs.map(d => d.data());
                    renderUI();
                });

                const qDep = query(collection(db, "deposits"), where("userId", "==", user.uid), orderBy("timestamp", "desc"));
                onSnapshot(qDep, (snap) => {
                    depositTransactions = snap.docs.map(d => d.data());
                    renderUI();
                });
            } else { 
                window.location.href = "../"; 
            }
        });

        window.handleLogout = () => { 
            const isAr = (localStorage.getItem('pref_lang') || 'ar') === 'ar';
            if(confirm(isAr ? "خروج؟" : "Logout?")) { localStorage.clear(); signOut(auth); } 
        };

        document.addEventListener('click', function(e) {
            const target = e.target.closest('.shortcut-item');
            if (target) {
                e.preventDefault();
                const url = target.getAttribute('href');
                const loader = document.getElementById('global-loading');
                loader.style.display = 'flex';
                setTimeout(() => {
                    loader.style.display = 'none';
                    if (url) window.location.href = url;
                    else if (target.getAttribute('onclick')) {
                        if(target.getAttribute('onclick').includes('handleLogout')) window.handleLogout();
                    }
                }, 800);
            }
        });
    </script>

    <script>
        window.sync = function() {
            const lang = localStorage.getItem('pref_lang') || 'ar';
            const isAr = (lang === 'ar');
            
            document.getElementById('loader-welcome-txt').innerText = isAr ? 'مرحباً بك في' : 'Welcome to';
            document.getElementById('txt-trans-title').innerText = isAr ? 'آخر المعاملات' : 'Recent Transactions';
            document.getElementById('txt-view-more').innerText = isAr ? 'عرض المزيد' : 'View More';
            document.getElementById('txt-smm').innerText = isAr ? 'خدمات SMM' : 'SMM Services';
            document.getElementById('txt-deposit').innerText = isAr ? 'إضافة رصيد' : 'Add Credit';
            document.getElementById('txt-menu').innerText = isAr ? 'القائمة' : 'Menu';
            document.getElementById('txt-logout').innerText = isAr ? 'خروج' : 'Logout';

            document.body.style.direction = isAr ? 'rtl' : 'ltr';
            document.documentElement.dir = isAr ? 'rtl' : 'ltr';
        };

        window.onload = () => { window.sync(); };
    </script>
</body>

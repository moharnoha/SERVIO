<!DOCTYPE html>
<html lang="ar" dir="rtl" class="notranslate" translate="no"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>serviocmm - Optimized UI</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            /* لوحة ألوان مستوحاة من الشعار */
            --primary-green: #2d5a1e;    /* الأخضر العميق من الشعار */
            --vibrant-green: #74a367;    /* الأخضر الفاتح من الشعار */
            --header-bg: #F3F2F2;        /* لون الهيدر المطلوب */
            --page-bg: #F3F2F2;          /* لون الصفحة المطلوب */
            --text-main: #1A1A1A;        /* أسود احترافي */
            --text-muted: #64748b;       /* رمادي للنصوص الثانوية */
            --circle-empty: #DAD9D9;     /* لون الدوائر الفارغة المنسق */
            --profile-icon: #AFAEAE;     /* لون أيقونة الشخصية */
            --profile-bg: #DAD9D9;       /* لون دائرة الملف الشخصي */
        }

        body { 
            margin: 0; padding: 0; 
            background-color: var(--page-bg); 
            direction: rtl !important; 
            -webkit-font-smoothing: antialiased;
            color: var(--text-main);
        }

        header { 
            width: 100%; height: 70px; 
            background-color: var(--header-bg); 
            display: flex; align-items: center; 
            padding: 0 15px;
            box-sizing: border-box;
            position: sticky; 
            top: 0; z-index: 1000;
            direction: rtl !important;
            box-shadow: none;
            border: none;
        }

        .header-content {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        @media (min-width: 481px) {
            .header-content {
                max-width: 100%;
                padding: 0 40px;
            }
        }

        .right-section { 
            display: flex; 
            align-items: center; 
            flex-shrink: 0;
            z-index: 2;
        }
        
        .center-section { 
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex; 
            align-items: center; 
            justify-content: center;
            width: auto;
        }

        .account-text {
            font-size: 22px; 
            font-weight: 700; 
            color: var(--text-main);
            font-family: 'Lexend', sans-serif;
            letter-spacing: -0.5px; 
        }

        .profile-icon-svg {
            width: 28px; 
            height: 28px; 
            fill: var(--profile-icon); 
        }

        .main-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 0 20px;
            box-sizing: border-box;
            background-color: var(--page-bg);
        }

        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 0px 0 25px 0;
        }

        .top-row {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            margin-bottom: 5px;
            flex-direction: row;
        }

        .balance-label-wrapper {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .balance-label {
            font-family: 'Lexend', sans-serif;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .chevron-down-svg {
            width: 12px;
            height: 12px;
            fill: none;
            stroke: var(--text-muted);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .balance-amount {
            font-family: 'Lexend', sans-serif;
            font-size: 42px; 
            font-weight: 400; 
            color: var(--text-main);
            line-height: 1;
            display: flex;
            align-items: baseline;
            gap: 8px;
            letter-spacing: -1.5px;
        }

        .currency-symbol {
            font-size: 18px;
            font-weight: 500;
            color: var(--text-main);
            letter-spacing: 0;
        }

        .card-icon-container {
            width: 40px;
            height: 40px;
            background-color: transparent;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            order: 2;
        }

        .servio-logo-svg {
            width: 100%;
            height: 100%;
            padding: 7px;
            box-sizing: border-box;
        }

        .circles-section {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 35px;
            padding: 10px 0;
        }

        .circle-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px; 
            flex: 1;
        }

        .empty-circle {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background-color: var(--circle-empty);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .deposit-circle {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-green), var(--vibrant-green));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(45, 90, 30, 0.25);
            border: none;
            transition: transform 0.2s ease;
        }

        .plus-icon-svg {
            width: 26px;
            height: 26px;
            fill: #FFFFFF;
        }

        .dots-icon {
            font-size: 24px;
            color: var(--text-main);
            font-weight: 800;
            letter-spacing: 1px;
            line-height: 0;
            margin-bottom: 8px;
        }

        .circle-label {
            font-family: 'Lexend', sans-serif;
            font-size: 13.5px;
            font-weight: 600; 
            color: #000000;
            letter-spacing: 0px;
        }
        
        .store-icon-svg {
            width: 32px;
            height: 32px;
            fill: #1B1A1A;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="right-section">
                <svg class="profile-icon-svg" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <clipPath id="circleView">
                            <circle cx="512" cy="512" r="512" />
                        </clipPath>
                    </defs>
                    <circle cx="512" cy="512" r="512" fill="var(--profile-bg)" />
                    <g clip-path="url(#circleView)">
                        <circle cx="512" cy="380" r="170.7" />
                        <path d="M100 880c0-140 150-200 412-200s412 60 412 200v150H100V880z" />
                    </g>
                </svg>
            </div>

            <div class="center-section">
                <span class="account-text">ServioCmm</span>
            </div>

            <div style="width: 28px;"></div>
        </div>
    </header>

    <main class="main-container">
        <div class="content-wrapper">
            <div class="top-row">
                <div class="balance-label-wrapper">

                                <stop offset="100%" style="stop-color:#1a3611;stop-opacity:1" />
                            </linearGradient>
                            <linearGradient id="vibrantGreen" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#74a367;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#5a854f;stop-opacity:1" />
                            </linearGradient>
                            <mask id="whiteGap">
                                <rect width="1000" height="800" fill="white" />
                                <circle cx="350" cy="400" r="362" fill="black" />
                            </mask>
                        </defs>
                        <circle cx="350" cy="400" r="350" fill="url(#deepGreen)" />
                        <circle cx="650" cy="400" r="350" fill="url(#vibrantGreen)" mask="url(#whiteGap)" fill-opacity="0.95" />
                        <g transform="rotate(-38 500 400)">
                            <rect x="290" y="390" width="75" height="145" rx="37.5" fill="#FFFFFF" />
                            <rect x="425" y="80" width="155" height="640" rx="77.5" fill="#FFFFFF" />
                            <rect x="640" y="445" width="75" height="145" rx="37.5" fill="#FFFFFF" />
                        </g>
                    </svg>
                </div>
            </div>
            <div class="balance-amount">0,00 <span class="currency-symbol">USD</span></div>

                    </div>
                    <span class="circle-label">إيداع</span>
                </div>

                    </div>
                    <span class="circle-label">متجر</span>
                </div>
                <div class="circle-item">
                    <div class="empty-circle"></div>
                    <span class="circle-label">سحب</span>
                </div>
                <div class="circle-item">
                    <div class="empty-circle">
                        <span class="dots-icon">...</span>
                    </div>
                    <span class="circle-label">مزيد</span>
                </div>
            </div>
        </div>
    </main>

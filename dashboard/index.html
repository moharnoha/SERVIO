<!DOCTYPE html>
<html lang="ar" dir="rtl" class="notranslate" translate="no"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="google" content="notranslate">
    <title>serviocmm - Optimized UI</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --primary-green: #2d5a1e;    
            --vibrant-green: #74a367;    
            --header-bg: #F3F2F2;        
            --page-bg: #F3F2F2;          
            --text-main: #121212;        
            --text-muted: #5f6368;       
            --circle-empty: #e8eaed;     
            --profile-icon: #9aa0a6;     
            --profile-bg: #e8eaed;       
            --border-subtle: rgba(0,0,0,0.06);
            --transition-main: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --nav-inactive: #8E8E93;
            /* Unified Font Strategy */
            --font-main: 'Lexend', 'Cairo', sans-serif;
            --font-secondary: 'Cairo', 'Lexend', sans-serif;
        }

        body { 
            margin: 0; padding: 0; 
            background-color: var(--page-bg); 
            direction: rtl !important; 
            -webkit-font-smoothing: antialiased;
            color: var(--text-main);
            font-family: var(--font-main) !important;
            overscroll-behavior-y: contain;
            touch-action: pan-x pan-y;
            padding-bottom: 75px;
        }

        #pull-refresh-area {
            width: 100%;
            height: 0;
            overflow: hidden;
            background-color: var(--page-bg);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            transition: height 0.2s ease-out;
            position: relative;
            z-index: 999;
            pointer-events: none;
            padding-bottom: 0px;
            box-sizing: border-box;
        }

        .pull-logo-box {
            width: 40px;
            height: 40px;
            opacity: 0;
            transform: scale(0.7);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .fill-layer-anim {
            clip-path: inset(100% 0 0 0);
        }

        body.is-pulling .pull-logo-box {
            opacity: 1;
            transform: scale(1);
        }

        body.is-refreshing .fill-layer-anim {
            animation: premiumFill 0.5s ease-in-out forwards;
        }

        body.is-refreshing .pull-logo-box {
            animation: pulse-logo 0.8s infinite ease-in-out;
        }

        @keyframes premiumFill {
            0% { clip-path: inset(100% 0 0 0); }
            100% { clip-path: inset(0% 0 0 0); }
        }

        @keyframes pulse-logo {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.05); filter: brightness(1.2); }
            100% { transform: scale(1); filter: brightness(1); }
        }

        header { 
            width: 100%; height: 72px; 
            background-color: var(--header-bg); 
            display: flex; align-items: center; 
            padding: 0 20px;
            box-sizing: border-box;
            position: relative; 
            top: 0; z-index: 1000;
            direction: rtl !important;
        }

        .header-content {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        @media (min-width: 481px) {
            .header-content {
                max-width: 100%;
                padding: 0 40px;
            }
        }

        .right-section { 
            display: flex; 
            align-items: center; 
            flex: 1;
            z-index: 2;
        }
        
        .left-section {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex: 1;
            z-index: 2;
            gap: 12px;
        }

        .center-section {
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
        }

        .header-action-icon {
            text-decoration: none;
            transition: var(--transition-main);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000000;
            background-color: var(--profile-bg);
            border-radius: 50%;
            width: 32px;
            height: 32px;
        }

        .header-action-icon:active {
            transform: scale(0.9);
            opacity: 0.7;
        }

        .account-text {
            font-size: 20px; 
            font-weight: 700; 
            color: var(--text-main);
            letter-spacing: -0.3px;
            font-family: var(--font-main) !important;
            font-display: block;
            white-space: nowrap;
        }

        .profile-icon-svg {
            width: 20px; 
            height: 20px; 
            fill: #000000; 
            transition: var(--transition-main);
        }

        .main-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 0 24px;
            box-sizing: border-box;
            background-color: var(--page-bg);
        }

        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 0;
        }

        .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 0px;
            padding-top: 0px;
        }

        .balance-label-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .balance-label {
            font-size: 15.5px;
            font-weight: 500;
            color: var(--text-muted);
            font-family: var(--font-secondary);
        }

        .chevron-down-svg {
            width: 13px;
            height: 13px;
            fill: none;
            stroke: var(--text-muted);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .balance-amount {
            font-size: 52px;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.1;
            display: flex;
            align-items: baseline;
            gap: 10px;
            letter-spacing: -2px;
            font-variant-numeric: tabular-nums;
            margin-bottom: 0px;
            min-height: 57px;
            font-family: var(--font-main);
        }

        .currency-symbol {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0;
            opacity: 0.7;
            font-family: var(--font-main);
        }

        .card-icon-container {
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .circles-section {
            display: flex;
            justify-content: flex-start;
            gap: 25px;
            width: 100%;
            margin-top: 5px;
            padding: 10px 0;
        }

        .circle-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px; 
            cursor: pointer;
            transition: var(--transition-bounce);
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
        }

        .circle-item:active .empty-circle, 
        .circle-item:active .deposit-circle {
            transform: scale(0.85);
            background-color: #d1d3d6;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .empty-circle {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background-color: var(--circle-empty);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none;
            transition: inherit;
        }

        .deposit-circle {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2d5a1e, #74a367);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(45, 90, 30, 0.2);
            border: none;
            transition: inherit;
        }

        .circle-svg-icon {
            width: 30px;
            height: 30px;
        }

        .circle-label {
            font-size: 14px;
            font-weight: 600; 
            color: #1a1a1a;
            letter-spacing: -0.1px;
            font-family: var(--font-secondary);
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--page-bg);
            display: flex;
            justify-content: space-between;
            align-items: center; 
            height: 75px; 
            border-top: 1px solid rgba(0,0,0,0.08);
            padding: 0;
            overflow: hidden; 
            z-index: 2000;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 33.33%;
            cursor: pointer;
            color: #000000;
            transition: transform 0.2s ease-out;
            height: 100%;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        .side-box {
            height: 34px; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .store-box {
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
        }

        .nav-item i {
            font-size: 22px; 
            -webkit-text-stroke: 0.5px #000000;
        }

        .store-circle {
            background-color: #4D783E; 
            width: 44px; 
            height: 44px; 
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 2;
        }

        .ring {
            position: absolute;
            width: 50px;
            height: 50px;
            border: 2px solid transparent;
            border-radius: 50%;
            transition: border-color 0.2s ease;
            z-index: 1;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .nav-item span {
            font-family: var(--font-secondary);
            font-size: 11px; 
            font-weight: 500;
            line-height: 1;
            transition: all 0.2s ease;
            white-space: nowrap;
            color: #000000;
        }

        .side-item span {
            margin-top: 0px; 
        }

        .store-item span {
            margin-top: 4px;
        }

        .nav-item.active span {
            font-weight: 800;
        }

        .nav-item.active .ring {
            border-color: #000000;
        }

        .nav-item.active {
            transform: scale(1.04);
        }

        .nav-item:active {
            transform: scale(0.97);
        }

        #page-modal {
            display: none;
            position: relative;
            width: 100%;
            height: calc(100vh - 147px);
            background: #FFFFFF;
            z-index: 500;
            overflow-y: auto;
            box-sizing: border-box;
        }

        #page-modal iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>

    <div id="pull-refresh-area">

                <defs>
                    <linearGradient id="pullDeep" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#2d5a1e" />

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
      import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
      import { getFirestore, doc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBYNRiMneaU-d6FPMbCnjcWQBX4Tdg50zk",
        authDomain: "serviocmm-a65ed.firebaseapp.com",
        projectId: "serviocmm-a65ed",
        storageBucket: "serviocmm-a65ed.firebasestorage.app",
        messagingSenderId: "975373759034",
        appId: "1:975373759034:web:645cb5fb48772839453b03"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      const el = document.getElementById('user-balance');
      const sym = document.getElementById('curr-sym');

      const updateUI = (balance) => {
        const formatted = balance.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        if(el) el.textContent = formatted;
        if(sym) sym.style.display = 'inline-block';
        localStorage.setItem('last_known_balance', formatted);
      };

      const savedBalance = localStorage.getItem('last_known_balance');
      if (savedBalance) updateUI(parseFloat(savedBalance.replace(/,/g, '')));

      window.refreshFirebaseData = async () => {
        const user = auth.currentUser;
        if (user) {
          const userDocRef = doc(db, "users", user.uid);
          const docSnap = await getDoc(userDocRef);
          if (docSnap.exists()) {
            const data = docSnap.data();
            if (data.balance !== undefined) updateUI(data.balance);
          }
        }
      };

      onAuthStateChanged(auth, (user) => {
        if (user) {
          const userDocRef = doc(db, "users", user.uid);
          onSnapshot(userDocRef, (docSnap) => {
            if (docSnap.exists()) {
              const data = docSnap.data();
              if (data.balance !== undefined) updateUI(data.balance);
            }
          });
        }
      });
    </script>

    <script>
        function showPage(event, page) {
            event.preventDefault();
            const modal = document.getElementById('page-modal');
            const main = document.getElementById('main-view');
            const navItems = document.querySelectorAll('.nav-item');

            navItems.forEach(item => item.classList.remove('active'));
            event.currentTarget.classList.add('active');

            if (page === 'home') {
                modal.style.display = 'none';
                main.style.display = 'block';
                document.body.style.backgroundColor = 'var(--page-bg)';
            } else {
                main.style.display = 'none';
                modal.style.display = 'block';
                document.body.style.backgroundColor = '#FFFFFF';
                modal.innerHTML = `<iframe src="${page}/"></iframe>`;
            }
        }

        let startY = 0;
        let isRefreshing = false;
        const body = document.body;
        const pullArea = document.getElementById('pull-refresh-area');
        const THRESHOLD = 75;

        const canPull = () => window.scrollY === 0;

        window.addEventListener('touchstart', (e) => {
            if (canPull()) {
                startY = e.touches[0].pageY;
                pullArea.style.transition = 'none';
            }
        }, {passive: true});

        window.addEventListener('touchmove', (e) => {
            if (isRefreshing || !canPull()) return;
            const currentY = e.touches[0].pageY;
            const diff = currentY - startY;
            if (diff > 0) {
                if (e.cancelable) e.preventDefault();
                const pullHeight = Math.min(diff * 0.4, THRESHOLD + 20); 
                pullArea.style.height = pullHeight + 'px';
                if (pullHeight > 10) body.classList.add('is-pulling');
            }
        }, {passive: false});

        window.addEventListener('touchend', async () => {
            if (isRefreshing) return;
            const currentHeight = parseInt(pullArea.style.height) || 0;
            
            if (currentHeight >= THRESHOLD) {
                isRefreshing = true;
                body.classList.add('is-refreshing');
                pullArea.style.transition = 'height 0.2s ease-out';
                pullArea.style.height = THRESHOLD + 'px';
                
                if (window.refreshFirebaseData) {
                    await window.refreshFirebaseData();
                }

                setTimeout(() => {
                    pullArea.style.transition = 'height 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
                    pullArea.style.height = '0px';
                    setTimeout(() => {
                        body.classList.remove('is-pulling', 'is-refreshing');
                        isRefreshing = false;
                    }, 400);
                }, 800);
            } else {
                pullArea.style.transition = 'height 0.3s ease-out';
                pullArea.style.height = '0px';
                body.classList.remove('is-pulling');
            }
        });
    </script>

<!DOCTYPE html>
<html lang="ar" dir="rtl" class="notranslate" translate="no"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>serviocmm - Pro Wallet</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --header-green: #FFFFFF; 
            --sub-green: #F3F2F2; 
            --platform-bg: #F8FAFC;
            --bg-gradient: linear-gradient(135deg, #F3F2F2 0%, #F3F2F2 100%);
            --text-dark: #1E293B;
            --brand-green: #2E5822;
            --brand-red: #C62828;
            --brand-deposit: #10b981; 
            --card-white: #FFFFFF;
            --shadow-soft: 0 10px 25px rgba(0, 0, 0, 0.04);
            --sidebar-gray: #f1f5f9;
        }

        html, body { 
            height: auto; 
            min-height: 100%; 
            margin: 0; 
            padding: 0; 
            overflow-x: hidden; 
            overflow-y: scroll !important; 
            width: 100vw;
            position: relative;
        }
        body { 
            font-family: 'Cairo', 'Inter', sans-serif; 
            background-color: var(--platform-bg); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        
        /* Main Application Loading Screen (Updated Section) */
        #app-init-loader {
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100000;
            /* Prevent any inversion or layout shift */
            direction: rtl !important; 
            unicode-bidi: isolate;
        }

        .loader-right-side {
            position: fixed !important;
            /* Explicit Right Anchor - Never changes */
            right: 0 !important;
            left: auto !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: flex-end !important;
            z-index: 100001;
            padding-right: 0 !important;
            margin-right: 0 !important;
        }

        .loader-welcome-msg {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 8px;
            padding-right: 15px;
            /* Force RTL & Right Alignment regardless of global settings */
            direction: rtl !important;
            text-align: right !important;
            white-space: nowrap;
            font-family: 'Cairo', sans-serif;
            display: block;
            width: 100%;
        }

        .loader-right-side img {
            width: 240px;
            height: auto;
            border-radius: 4px 0 0 4px;
            display: block;
            /* Prevent image mirroring */
            transform: none !important;
        }

        /* Global Click Loading Overlay */
        #global-loading {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.19);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            display: none; /* Hidden by default */
        }
        .ios-loader {
            width: 40px;
            height: 40px;
            background-image: url('data:image/svg+xml;utf8,<svg width="120" height="120" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g><rect x="46.5" y="40" width="7" height="20" rx="3.5" ry="3.5" fill="%232E5822" transform="rotate(0 50 50) translate(0 -30)"><animate attributeName="opacity" from="1" to="0" dur="1s" begin="0s" repeatCount="indefinite"/></rect><rect x="46.5" y="40" width="7" height="20" rx="3.5" ry="3.5" fill="%232E5822" transform="rotate(30 50 50) translate(0 -30)"><animate attributeName="opacity" from="1" to="0" dur="1s" begin="0.083s" repeatCount="indefinite"/></rect><rect x="46.5" y="40" width="7" height="20" rx="3.5" ry="3.5" fill="%232E5822" transform="rotate(60 50 50) translate(0 -30)"><animate attributeName="opacity" from="1" to="0" dur="1s" begin="0.166s" repeatCount="indefinite"/></rect><rect x="46.5" y="40" width="7" height="20" rx="3.5" ry="3.5" fill="%232E5822" transform="rotate(90 50 50) translate(0 -30)"><animate attributeName="opacity" from="1" to="0" dur="1s" begin="0.25s" repeatCount="indefinite"/></rect><rect x="46.5" y="40" width="7" height="20" rx="3.5" ry="3.5" fill="%232E5822" transform="rotate(120 50 50) translate(0 -30)"><animate attributeName="opacity" from="1" to="0" dur="1s" begin="0.333s" repeatCount="indefinite"/></rect><rect x="46.5" y="40" width="7" height="20" rx="3.5" ry="3.5" fill="%232E5822" transform="rotate(150 50 50) translate(0 -30)"><animate attributeName="opacity" from="1" to="0" dur="1s" begin="0.416s" repeatCount="indefinite"/></rect><rect x="46.5" y="40" width="7" height="20" rx="3.5" ry="3.5" fill="%232E5822" transform="rotate(180 50 50) translate(0 -30)"><animate attributeName="opacity" from="1" to="0" dur="1s" begin="0.5s" repeatCount="indefinite"/></rect><rect x="46.5" y="40" width="7" height="20" rx="3.5" ry="3.5" fill="%232E5822" transform="rotate(210 50 50) translate(0 -30)"><animate attributeName="opacity" from="1" to="0" dur="1s" begin="0.583s" repeatCount="indefinite"/></rect><rect x="46.5" y="40" width="7" height="20" rx="3.5" ry="3.5" fill="%232E5822" transform="rotate(240 50 50) translate(0 -30)"><animate attributeName="opacity" from="1" to="0" dur="1s" begin="0.666s" repeatCount="indefinite"/></rect><rect x="46.5" y="40" width="7" height="20" rx="3.5" ry="3.5" fill="%232E5822" transform="rotate(270 50 50) translate(0 -30)"><animate attributeName="opacity" from="1" to="0" dur="1s" begin="0.75s" repeatCount="indefinite"/></rect><rect x="46.5" y="40" width="7" height="20" rx="3.5" ry="3.5" fill="%232E5822" transform="rotate(300 50 50) translate(0 -30)"><animate attributeName="opacity" from="1" to="0" dur="1s" begin="0.833s" repeatCount="indefinite"/></rect><rect x="46.5" y="40" width="7" height="20" rx="3.5" ry="3.5" fill="%232E5822" transform="rotate(330 50 50) translate(0 -30)"><animate attributeName="opacity" from="1" to="0" dur="1s" begin="0.916s" repeatCount="indefinite"/></rect></g></svg>');
            background-size: contain;
            background-repeat: no-repeat;
        }

        * { 
            transition: all 0.3s ease !important; 
            animation: none !important; 
            -webkit-tap-highlight-color: transparent; 
            box-sizing: border-box;
        }

        .top-header { 
            min-height: 70px; background-color: var(--header-green); 
            display: flex; align-items: center; justify-content: space-between; 
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 2000;
            padding: 10px 15px;
            box-sizing: border-box;
            direction: rtl !important;
            border-bottom: 1px solid #F1F5F9;
        }

        .header-content {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            direction: rtl !important;
        }

        @media (min-width: 481px) {
            .top-header {
                height: 70px;
            }
            .header-content {
                max-width: 100%;
                padding: 0 40px;
            }
        }

        .brand-section { display: flex; align-items: center; }
        .logo-img { height: 35px; width: auto; }
        .v-line { width: 1px; height: 30px; background-color: rgba(0,0,0,0.1); margin: 0 12px; }
        .title-box { display: flex; flex-direction: column; text-align: right; }
        .title-box span:first-child { font-size: 11px; font-weight: 800; color: #1A2419; }
        .title-box span:last-child { font-size: 9px; font-weight: 600; color: rgba(26,36,25,0.6); }
        .region-badge { display: flex; align-items: center; background: #FFFFFF; border: 1px solid #E2E7F0; border-radius: 8px; padding: 0 10px; height: 40px; gap: 8px; direction: rtl !important; }
        .region-text { font-size: 11px; font-weight: 700; color: #1A2419; display: flex; gap: 5px; }

        .bottom-header {
            background-color: var(--platform-bg);
            width: 100%; display: flex; justify-content: center;
            position: relative;
        }
        .bottom-header-content {
            width: 100%; max-width: 480px; padding: 15px; box-sizing: border-box;
        }

        .wallet-card {
            background: linear-gradient(135deg, #2E5822 0%, #1a3614 100%);
            border-radius: 24px; padding: 18px;
            display: flex; flex-direction: column; gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 12px 30px rgba(46, 88, 34, 0.15);
            min-height: auto;
        }

        .user-meta-info { display: flex; align-items: center; justify-content: space-between; width: 100%; border-bottom: none; padding-bottom: 5px; }
        .avatar-box { width: 32px; height: 32px; background: rgba(255, 255, 255, 0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .avatar-box svg { width: 100%; height: 100%; padding: 4px; fill: #ffffff; }
        .name-stack { display: flex; flex-direction: column; gap: 1px; overflow: hidden; flex: 1; align-items: flex-start; }
        
        .welcome-row { display: flex; flex-direction: column; align-items: flex-start; width: 100%; }
        .welcome-label { font-size: 10px; color: rgba(255,255,255,0.7); font-weight: 700; letter-spacing: 0.3px; }
        
        .full-name-val { font-size: 16px; color: #ffffff; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; margin-top: 0px; }
        
        .email-privacy-row { display: flex; align-items: center; gap: 6px; width: 100%; justify-content: flex-start; }
        .user-email-val { font-size: 11px; color: rgba(255,255,255,0.6); font-weight: 500; direction: ltr; font-family: 'Inter', sans-serif; overflow: hidden; text-overflow: ellipsis; }
        
        .toggle-visibility { background: rgba(255,255,255,0.1); border: none; padding: 3px 6px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; }
        .toggle-visibility svg { width: 13px; height: 13px; fill: rgba(255,255,255,0.8) !important; }

        .balance-stack { display: flex; flex-direction: column; align-items: center; width: 100%; padding: 10px 0 5px 0; }
        .bal-title { font-size: 10px; color: rgba(255,255,255,0.6); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        
        .bal-amount { 
            font-size: 32px; 
            color: #ffffff; 
            font-weight: 900; 
            line-height: 1.1; 
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: baseline;
            justify-content: center;
            direction: ltr;
        }
        .bal-amount sup { font-size: 0.6em; margin-left: 1px; font-weight: 700; }

        .new-header-container {
            background: transparent; 
            width: 100%; display: flex; justify-content: center;
            position: relative;
        }
        .new-header-content {
            width: 100%; max-width: 480px; padding: 15px 20px 25px 20px; box-sizing: border-box;
        }
        .shortcuts-scroll-wrapper { display: flex; justify-content: space-between; gap: 12px; }
        .shortcut-item { display: flex; flex-direction: column; align-items: center; flex: 1; gap: 10px; text-decoration: none; cursor: pointer; }
        
        .icon-box { 
            width: 62px; 
            height: 62px; 
            background: #FFFFFF; 
            border-radius: 20px; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.03); 
            display: flex; 
            align-items: center; 
            justify-content: center;
            border: 1px solid #F1F5F9;
        }
        .icon-box:active { transform: scale(0.94); background: #F8FAFC; }
        
        .shortcut-label { font-size: 11px; font-weight: 800; color: #475569; text-align: center; white-space: nowrap; }
        
        /* Specialized Colors for Icons */
        .icon-svg-smm { width: 28px; height: 28px; fill: #2E5822; }
        .icon-svg-deposit { width: 30px; height: 30px; fill: #10b981; }
        .icon-svg-menu { width: 28px; height: 28px; fill: #64748b; }
        .icon-svg-logout { width: 26px; height: 26px; fill: #ef4444; }

        .transactions-header { 
            width: 100%; display: flex; flex-direction: column; align-items: center;
            background: transparent; 
            margin-top: 0;
            flex: none;
            overflow: visible; 
        }
        .transactions-content {
            width: 100%; max-width: 480px; padding: 25px 20px; box-sizing: border-box;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            height: 420px;
            border-radius: 32px 32px 0 0;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.03);
            margin: 0;
            border-top: 1px solid #F1F5F9;
        }
        
        .filter-options { display: none; }

        .trans-list { 
            display: flex; 
            flex-direction: column; 
            gap: 14px; 
            margin-top: 10px;
            overflow-y: auto;
            flex: 1;
            padding-right: 2px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .trans-list::-webkit-scrollbar { display: none; }

        .trans-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px; background: #F8FAFC; border-radius: 18px; border: 1px solid #F1F5F9;
            contain: content; cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }
        .trans-item:active { transform: scale(0.98); background: #F1F5F9; }
        
        .status-inline {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            font-weight: 800;
            margin-right: 8px;
            padding: 3px 8px;
            border-radius: 6px;
            color: #64748b !important;
            background: #FFFFFF !important;
            border: 1px solid #EDF2F7;
        }

        .trans-date-container { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
        .status-badge { display: none; }
        .trans-date { font-size: 10px; color: #94A3B8; direction: ltr; display: block; margin-top: 2px; font-weight: 600; }
        .trans-val { font-size: 15px; font-weight: 800; direction: ltr; color: #1E293B; font-family: 'Inter', sans-serif; letter-spacing: -0.3px; }
        
        .empty-state { 
            text-align: center; 
            padding: 50px 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex: 1;
        }
        .empty-state-icon {
            width: 90px; height: 90px;
            background: transparent;
            display: flex; align-items: center; justify-content: center;
            color: #2E5822;
            position: relative;
        }
        .empty-state-icon svg {
            width: 110px; 
            height: 110px;
            fill: #2E5822;
            opacity: 0.8;
        }
        .empty-state-text {
            font-size: 14px;
            font-weight: 800;
            color: #64748B;
        }

        svg.icon, .nav-icon { width: 22px; height: 22px; fill: #1A2419 !important; }
        .nav-flag { width: 22px; height: 15px; border-radius: 2px; object-fit: cover; }

        .modal-overlay {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: #F8FAFC; 
            display: none; 
            align-items: flex-start; 
            justify-content: center; 
            z-index: 9999;
        }
        .modal-card {
            background: #F8FAFC; 
            width: 100%; 
            height: 100%;
            padding: 0;
            position: relative; 
            overflow: hidden;
            border: none;
            display: flex;
            flex-direction: column;
        }
        .modal-header-accent {
            padding: 12px 20px; 
            background-color: #ffffff;
            color: #1E293B;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 10px rgba(0,0,0,0.02);
            min-height: 65px;
            width: 100%;
        }
        .modal-header-inner {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-title-text { 
            font-weight: 900; 
            font-size: 18px; 
            margin: 0;
            color: #1E293B;
            flex: 1;
            text-align: center;
        }
        .modal-body { 
            padding: 20px; 
            font-size: 13px; 
            color: var(--text-dark); 
            background: #F8FAFC;
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }
        .modal-close-icon {
            cursor: pointer;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: #F1F5F9;
            color: #475569;
        }
        
        /* User Info Section in Modal */
        .modal-user-sticky {
            flex-shrink: 0;
            margin-bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
        }
        
        .modal-user-sticky .wallet-card {
            width: 100%;
            box-shadow: 0 10px 25px rgba(46, 88, 34, 0.1);
        }
        
        .modal-user-sticky .toggle-visibility,
        .modal-user-sticky .avatar-box {
            display: none !important;
        }

        .detail-modal-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(15, 23, 42, 0.6); display:none; align-items:center; justify-content:center;
            z-index: 10000; padding: 20px; box-sizing: border-box;
            backdrop-filter: blur(4px);
        }
        .detail-card {
            background: #fff; width: 100%; max-width: 380px; border-radius: 28px; padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .detail-row {
            display: flex; align-items: flex-start; justify-content: space-between;
            padding: 14px 0; border-bottom: 1px solid #F1F5F9; gap: 15px;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { font-weight: 700; font-size: 12px; color: #94A3B8; white-space: nowrap; }
        .detail-value { font-weight: 700; font-size: 13px; color: #1E293B; text-align: left; line-height: 1.4; }
        .detail-value.is-active { color: #D97706; background: #FFFBEB; padding: 4px 10px; border-radius: 8px; border: 1px solid #FEF3C7; }
        .detail-value.is-activated { color: #059669; background: #ECFDF5; padding: 4px 10px; border-radius: 8px; border: 1px solid #D1FAE5; }
        .detail-value.is-rejected { color: #DC2626; background: #FEF2F2; padding: 4px 10px; border-radius: 8px; border: 1px solid #FEE2E2; }

        .page-wrapper { width: 100%; display: flex; flex-direction: column; align-items: center; min-height: 100%; background-color: var(--platform-bg); overflow: visible; }
        
        .view-more-link {
            color: #2E5822;
            font-size: 13px;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            padding: 6px 12px;
            background: #ECFDF5;
            border-radius: 10px;
        }
        .view-more-link:active { background: #D1FAE5; }

        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        .loader-spin {
            animation: spin 0.8s linear infinite !important;
        }
    </style>
</head>
<body class="notranslate">

    <div id="app-init-loader">
        <div class="loader-right-side">
            <div id="loader-welcome-txt" class="loader-welcome-msg">مرحباً بك في</div>
            <a href="https://postimg.cc/dk8H8qw8" target="_blank">
                <img src="https://i.postimg.cc/rmHB2mHY/servio.png" alt="servio.png">
            </a>
        </div>
    </div>

    <div id="global-loading">
        <div class="ios-loader"></div>
    </div>

    <div class="page-wrapper">
        <div class="top-header">
            <div class="header-content">
                <div class="brand-section">
                    <img src="https://i.postimg.cc/MKdMnLSy/servio.png" alt="logo" class="logo-img">
                    <div class="v-line"></div>
                    <div class="title-box"><span>مركز الخدمات الرقمية</span><span>Digital Services Center</span></div>
                </div>
                <div class="region-badge">
                    <div id="flag-ui"></div>
                    <div class="region-text"><span id="reg-name"></span><span style="opacity:0.3">|</span><span id="lang-name"></span></div>
                </div>
            </div>
        </div>

        <div class="bottom-header">
            <div class="bottom-header-content">
                <div class="wallet-card" id="main-wallet-card">
                    <div class="user-meta-info">
                        <div class="name-stack">
                            <div class="welcome-row">
                                <span class="welcome-label" id="txt-welcome"></span>
                                <span class="full-name-val" id="user-full-name"></span>
                            </div>
                            <div class="email-privacy-row">
                                <span class="user-email-val" id="user-email"></span>
                                <button class="toggle-visibility" onclick="togglePrivacy()"><svg id="eye-icon" viewBox="0 0 24 24"></svg></button>
                            </div>
                        </div>
                        <div class="avatar-box">
                            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
                        </div>
                    </div>
                    <div class="balance-stack">
                        <span class="bal-title" id="txt-balance-label"></span>
                        <div class="bal-amount" id="user-balance"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="new-header-container">
            <div class="new-header-content">
                <div class="shortcuts-scroll-wrapper">
                    <a href="smm-services/" class="shortcut-item simulate-link">
                        <div class="icon-box">
                            <svg class="icon-svg-smm" viewBox="0 0 24 24"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71L12 2z"/></svg>
                        </div>
                        <span class="shortcut-label" id="txt-smm"></span>
                    </a>
                    <a href="deposit/" class="shortcut-item simulate-link">

            <button class="modal-close-btn" style="width: 100%; background: #f1f5f9; color: #475569; border: none; padding: 14px 0; border-radius: 16px; font-weight: 800; font-size: 14px; margin-top:25px; cursor:pointer;" onclick="closeDetail()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="transform: scaleX(-1); margin-left: 5px; vertical-align: middle;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, query, where, orderBy, limit, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBYNRiMneaU-d6FPMbCnjcWQBX4Tdg50zk", authDomain: "serviocmm-a65ed.firebaseapp.com", 
            projectId: "serviocmm-a65ed", storageBucket: "serviocmm-a65ed.firebasestorage.app", 
            messagingSenderId: "975373759034", appId: "1:975373759034:web:645cb5fb48772839453b03" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let smmTransactions = [];
        let depositTransactions = [];
        const DISPLAY_LIMIT = 20;

        /* SPLASH SCREEN SYSTEM (STABLE & SECURE) */
        let splashTimer = null;
        const splashTimeoutDuration = 8000; // 8 Seconds fallback

        const hideInitialLoader = () => {
            const loader = document.getElementById('app-init-loader');
            if (loader && loader.style.display !== 'none') {
                if(splashTimer) clearTimeout(splashTimer);
                loader.style.transition = 'opacity 0.4s ease';
                loader.style.opacity = '0';
                setTimeout(() => { 
                    loader.style.display = 'none'; 
                }, 400);
            }
        };

        splashTimer = setTimeout(() => {
            console.warn("Splash screen timed out. Forcing display.");
            hideInitialLoader();
        }, splashTimeoutDuration);

        const cached = JSON.parse(localStorage.getItem('user_cache') || '{}');
        if (cached.balance !== undefined) {
            document.getElementById('user-balance').innerHTML = formatBalanceVal(cached.balance) + "<span>&nbsp;USD</span>";
        }
        
        function formatBalanceVal(val) {
            if (val === undefined || val === null || isNaN(val)) return "0.00";
            const num = Number(val);
            const strVal = num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 7 });
            if (strVal.includes('.')) {
                const [main, dec] = strVal.split('.');
                return `${main}<sup>.${dec}</sup>`;
            }
            return strVal;
        };

        window.showDetails = (title, amount, status, date, fullDesc, quantity, code, username) => {
            const isAr = (localStorage.getItem('pref_lang') || 'ar') === 'ar';
            const statusLow = status.toLowerCase();
            const statusStyle = statusLow === 'activated' ? 'is-activated' : (statusLow === 'active' ? 'is-active' : (statusLow === 'rejected' ? 'is-rejected' : ''));
            const statusDisplay = statusLow === 'activated' ? (isAr ? 'مكتمل' : 'Completed') : (statusLow === 'active' ? (isAr ? 'قيد الانتظار' : 'Pending') : (statusLow === 'rejected' ? (isAr ? 'مرفوض' : 'Rejected') : status));

            let html = `
                <div style="text-align:center; margin-bottom:25px;">
                    <div style="font-weight:900; font-size:24px; color:#1E293B; direction:ltr; font-family:'Inter'">${amount}</div>
                    <div style="font-size:13px; color:#64748B; margin-top:6px; font-weight:700;">${title}</div>
                </div>
                <div class="detail-row">
                    <span class="detail-label">${isAr ? 'نوع العملية' : 'Transaction Type'}</span>
                    <span class="detail-value">${amount.startsWith('+') ? fullDesc : (isAr ? 'شراء: ' : 'Purchase: ') + fullDesc}</span>
                </div>
                ${quantity ? `<div class="detail-row"><span class="detail-label">${isAr ? 'الكمية' : 'Quantity'}</span><span class="detail-value" style="direction:ltr">${quantity}</span></div>` : ''}
                ${code ? `<div class="detail-row"><span class="detail-label">${isAr ? 'الكود' : 'Code'}</span><span class="detail-value" style="direction:ltr; background:#F1F5F9; padding:2px 6px; border-radius:4px;">${code}</span></div>` : ''}
                ${username ? `<div class="detail-row"><span class="detail-label">${isAr ? 'المستخدم' : 'Username'}</span><span class="detail-value" style="direction:ltr">${username}</span></div>` : ''}
                <div class="detail-row">
                    <span class="detail-label">${isAr ? 'الحالة' : 'Status'}</span>
                    <span class="detail-value ${statusStyle}">${statusDisplay}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">${isAr ? 'التاريخ' : 'Date'}</span>
                    <span class="detail-value" style="direction:ltr; font-size:12px">${date}</span>
                </div>
            `;
            
            document.getElementById('detail-content').innerHTML = html;
            document.getElementById('detail-modal').style.display = 'flex';
        };

        window.closeDetail = () => {
            document.getElementById('detail-modal').style.display = 'none';
        };

        window.showAllTransactions = () => {
            const isAr = (localStorage.getItem('pref_lang') || 'ar') === 'ar';
            const allTrans = [...smmTransactions, ...depositTransactions].sort((a, b) => {
                const dateA = a.timestamp?.toDate ? a.timestamp.toDate() : new Date(a.timestamp);
                const dateB = b.timestamp?.toDate ? b.timestamp.toDate() : new Date(b.timestamp);
                return dateB - dateA;
            });
            
            document.getElementById('modal-title').innerText = isAr ? 'سجل العمليات' : 'Transaction History';

            const walletOriginal = document.getElementById('main-wallet-card').cloneNode(true);
            walletOriginal.id = "modal-wallet-sticky";
            document.getElementById('modal-user-info-area').innerHTML = '';
            document.getElementById('modal-user-info-area').appendChild(walletOriginal);

            if (allTrans.length === 0) {
                document.getElementById('modal-content').innerHTML = `<div class="empty-state"><p class="empty-state-text">${isAr ? 'لا توجد عمليات مسجلة' : 'No transactions recorded'}</p></div>`;
            } else {
                let html = '';
                allTrans.forEach(t => {
                    const isDep = depositTransactions.includes(t);
                    const status = (t.status || 'active').toLowerCase();
                    let statusLabel = "";
                    if (status === 'active') {
                        statusLabel = `<span class="status-inline">${isAr ? 'قيد الانتظار' : 'Pending'}</span>`;
                    } else if (status === 'activated') {
                        statusLabel = `<span class="status-inline" style="color:#10b981">${isAr ? 'مكتمل' : 'Completed'}</span>`;
                    } else if (status === 'rejected') {
                        statusLabel = `<span class="status-inline" style="color:#ef4444">${isAr ? 'مرفوض' : 'Rejected'}</span>`;
                    }

                    const date = t.timestamp ? (t.timestamp.toDate ? t.timestamp.toDate() : new Date(t.timestamp)) : new Date();
                    const dateStr = `${date.getFullYear()}/${date.getMonth()+1}/${date.getDate()} - ${date.toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit', hour12:true})}`;
                    const displayTitle = isDep ? (isAr ? 'إيداع في الحساب' : 'Account Deposit') : (isAr ? 'شراء خدمة رقمية' : 'Digital Service');
                    const amountLabel = isDep ? `+${t.amount} USD` : `${t.amount} USD`;

                    html += `
                        <div class="trans-item" style="margin-bottom:12px;" onclick="showDetails('${displayTitle.replace(/'/g, "\\'")}', '${amountLabel}', '${t.status}', '${dateStr}', '${(t.description || displayTitle).replace(/'/g, "\\'")}', '${t.quantity || ""}', '${t.code || ""}', '${t.username || ""}')">
                            <div style="display:flex; flex-direction:column">
                                <div style="display:flex; align-items:center;">
                                    <span style="font-weight:700; font-size:13px; color:#1E293B;">${displayTitle}</span>
                                    ${statusLabel}
                                </div>
                                <span class="trans-date">${dateStr}</span>
                            </div>
                            <span class="trans-val" style="color:${isDep ? '#10B981' : '#1E293B'}">${amountLabel}</span>
                        </div>`;
                });
                document.getElementById('modal-content').innerHTML = html;
            }
            document.getElementById('trans-modal').style.display = 'flex';
        };

        window.closeModal = () => {
            document.getElementById('trans-modal').style.display = 'none';
        };

        const renderUI = () => {
            const container = document.getElementById('trans-container');
            const isAr = (localStorage.getItem('pref_lang') || 'ar') === 'ar';
            const allTrans = [...smmTransactions, ...depositTransactions].sort((a, b) => {
                const dateA = a.timestamp?.toDate ? a.timestamp.toDate() : new Date(a.timestamp);
                const dateB = b.timestamp?.toDate ? b.timestamp.toDate() : new Date(b.timestamp);
                return dateB - dateA;
            }).slice(0, DISPLAY_LIMIT);
            
            if (allTrans.length === 0) {
                container.innerHTML = `<div class="empty-state"><p class="empty-state-text">${isAr ? 'لا توجد معاملات' : 'No transactions'}</p></div>`;
                return;
            }

            let html = "";
            allTrans.forEach(t => {
                const isDep = depositTransactions.includes(t);
                const status = (t.status || 'active').toLowerCase();
                let statusLabel = "";
                if (status === 'active') statusLabel = `<span class="status-inline">${isAr ? 'قيد الانتظار' : 'Pending'}</span>`;
                else if (status === 'activated') statusLabel = `<span class="status-inline" style="color:#10b981">${isAr ? 'مكتمل' : 'Completed'}</span>`;
                else if (status === 'rejected') statusLabel = `<span class="status-inline" style="color:#ef4444">${isAr ? 'مرفوض' : 'Rejected'}</span>`;

                const date = t.timestamp ? (t.timestamp.toDate ? t.timestamp.toDate() : new Date(t.timestamp)) : new Date();
                const dateStr = `${date.getFullYear()}/${date.getMonth()+1}/${date.getDate()} - ${date.toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit', hour12:true})}`;
                const displayTitle = isDep ? (isAr ? 'إيداع في الحساب' : 'Account Deposit') : (isAr ? 'شراء خدمة رقمية' : 'Digital Service');
                const amountLabel = isDep ? `+${t.amount} USD` : `${t.amount} USD`;

                html += `
                    <div class="trans-item" onclick="showDetails('${displayTitle.replace(/'/g, "\\'")}', '${amountLabel}', '${t.status}', '${dateStr}', '${(t.description || displayTitle).replace(/'/g, "\\'")}', '${t.quantity || ""}', '${t.code || ""}', '${t.username || ""}')">
                        <div style="display:flex; flex-direction:column">
                            <div style="display:flex; align-items:center;">
                                <span style="font-weight:700; font-size:13px; color:#1E293B;">${displayTitle}</span>
                                ${statusLabel}
                            </div>
                            <span class="trans-date">${dateStr}</span>
                        </div>
                        <span class="trans-val" style="color:${isDep ? '#10B981' : '#1E293B'}">${amountLabel}</span>
                    </div>`;
            });
            container.innerHTML = html;
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.currentEmail = user.email;
                onSnapshot(doc(db, "users", user.uid), (snap) => {
                    if (snap.exists()) {
                        const d = snap.data();
                        const bal = d.balance || 0; 
                        window.currentName = d.fullName || d.name || "User";
                        document.getElementById('user-balance').innerHTML = formatBalanceVal(bal) + "<span>&nbsp;USD</span>";
                        localStorage.setItem('user_cache', JSON.stringify({name: window.currentName, email: user.email, balance: bal}));
                        localStorage.setItem('hide_email', d.hide_email === "true");
                        localStorage.setItem('hide_username', d.hide_username === "true");
                        window.renderUserData();
                        hideInitialLoader();
                    }
                });

                const qSmm = query(collection(db, "transactions"), where("userId", "==", user.uid), orderBy("timestamp", "desc"));
                onSnapshot(qSmm, (snap) => {
                    smmTransactions = snap.docs.map(d => d.data());
                    renderUI();
                });

                const qDep = query(collection(db, "deposits"), where("userId", "==", user.uid), orderBy("timestamp", "desc"));
                onSnapshot(qDep, (snap) => {
                    depositTransactions = snap.docs.map(d => d.data());
                    renderUI();
                });
            } else { 
                window.location.href = "../"; 
            }
        });

        window.handleLogout = () => { 
            const isAr = (localStorage.getItem('pref_lang') || 'ar') === 'ar';
            if(confirm(isAr ? "هل تريد الخروج؟" : "Logout?")) { localStorage.clear(); signOut(auth); } 
        };

        window.togglePrivacy = async function() { 
            const user = auth.currentUser;
            if (!user) return;
            const currentStatus = localStorage.getItem('hide_email') === 'true';
            const newVal = !currentStatus ? "true" : "false";
            try {
                await updateDoc(doc(db, "users", user.uid), { hide_email: newVal, hide_username: newVal });
                localStorage.setItem('hide_email', newVal);
                localStorage.setItem('hide_username', newVal);
                window.renderUserData(); 
            } catch (e) { console.error(e); }
        };

        document.addEventListener('click', function(e) {
            const target = e.target.closest('.shortcut-item');
            if (target) {
                e.preventDefault();
                const url = target.getAttribute('href');
                const loader = document.getElementById('global-loading');
                loader.style.display = 'flex';
                setTimeout(() => {
                    loader.style.display = 'none';
                    if (url) window.location.href = url;
                    else if (target.getAttribute('onclick')) {
                        if(target.getAttribute('onclick').includes('handleLogout')) window.handleLogout();
                    }
                }, 800);
            }
        });
    </script>

    <script>
        const menaIcon = `<svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>`;
        const globeIcon = `<svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>`;

        const regionConfigs = [
            { id: 'mena', ar: "الشرق الأوسط", en: "MENA", type: 'icon', svg: menaIcon },
            { id: 'algeria', ar: "الجزائر", en: "Algeria", flag: 'https://flagcdn.com/dz.svg' },
            { id: 'egypt', ar: "مصر", en: "Egypt", flag: 'https://flagcdn.com/eg.svg' },
            { id: 'iraq', ar: "العراق", en: "Iraq", flag: 'https://flagcdn.com/iq.svg' },
            { id: 'morocco', ar: "المغرب", en: "Morocco", flag: 'https://flagcdn.com/ma.svg' },
            { id: 'nigeria', ar: "نيجيريا", en: "Nigeria", flag: 'https://flagcdn.com/ng.svg' },
            { id: 'oman', ar: "عمان", en: "Oman", flag: 'https://flagcdn.com/om.svg' },
            { id: 'palestine', ar: "فلسطين", en: "Palestine", flag: 'https://flagcdn.com/ps.svg' },
            { id: 'qatar', ar: "قطر", en: "Qatar", flag: 'https://flagcdn.com/qa.svg' },
            { id: 'saudi', ar: "السعودية", en: "Saudi Arabia", flag: 'https://flagcdn.com/sa.svg' },
            { id: 'tunisia', ar: "تونس", en: "Tunisia", flag: 'https://flagcdn.com/tn.svg' },
            { id: 'uae', ar: "الإمارات", en: "UAE", flag: 'https://flagcdn.com/ae.svg' },
            { id: 'other', ar: "منطقة أخرى", en: "Other Region", type: 'icon', svg: globeIcon }
        ];

        window.sync = function() {
            const lang = localStorage.getItem('pref_lang') || 'ar';
            const regIdx = parseInt(localStorage.getItem('pref_reg_idx')) || 0;
            const reg = regionConfigs[regIdx] || regionConfigs[0];
            const isAr = (lang === 'ar');
            
            document.getElementById('lang-name').innerText = lang.toUpperCase();
            document.getElementById('reg-name').innerText = reg[lang];
            const flagBox = document.getElementById('flag-ui');
            flagBox.innerHTML = reg.type === 'icon' ? reg.svg : `<img src="${reg.flag}" class="nav-flag">`;
            
            document.getElementById('loader-welcome-txt').innerText = isAr ? 'مرحباً بك في' : 'Welcome to';
            document.getElementById('txt-welcome').innerText = isAr ? 'مرحباً بك' : 'Welcome';
            document.getElementById('txt-balance-label').innerText = isAr ? 'رصيدك الحالي' : 'Current Balance';
            document.getElementById('txt-trans-title').innerText = isAr ? 'آخر المعاملات' : 'Recent Transactions';
            document.getElementById('txt-view-more').innerText = isAr ? 'عرض الكل' : 'View All';
            document.getElementById('txt-smm').innerText = isAr ? 'خدمات SMM' : 'SMM Services';
            document.getElementById('txt-deposit').innerText = isAr ? 'إضافة رصيد' : 'Add Credit';
            document.getElementById('txt-menu').innerText = isAr ? 'القائمة' : 'Menu';
            document.getElementById('txt-logout').innerText = isAr ? 'خروج' : 'Logout';

            document.body.style.direction = isAr ? 'rtl' : 'ltr';
            document.documentElement.dir = isAr ? 'rtl' : 'ltr';
            window.renderUserData();
        };

        window.renderUserData = function() {
            const nameEl = document.getElementById('user-full-name');
            const emailEl = document.getElementById('user-email');
            const eyeIcon = document.getElementById('eye-icon');
            const cached = JSON.parse(localStorage.getItem('user_cache') || '{}');
            const hideEmail = localStorage.getItem('hide_email') === "true";
            const hideUser = localStorage.getItem('hide_username') === "true";
            const rawName = window.currentName || cached.name || "";
            const rawEmail = window.currentEmail || cached.email || "";

            nameEl.innerText = hideUser ? "*****" : rawName;
            if (hideEmail && rawEmail.includes('@')) {
                const parts = rawEmail.split('@');
                emailEl.innerText = (parts[0].length > 2 ? parts[0].substring(0, 2) + "****" : parts[0] + "****") + "@" + parts[1];
            } else { emailEl.innerText = rawEmail; }

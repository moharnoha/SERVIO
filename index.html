<!DOCTYPE html>
<html lang="ar" dir="rtl" class="notranslate" translate="no"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>serviocmm - Final Version</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --header-green: #FFFFFF; 
            /* تم تغيير اللون الأساسي إلى الأزرق */
            --login-bg: #0095f6; 
            --google-section-bg: #EAF0E9; 
            --platform-bg: #f7fafc;
            --accent-blue: #0095f6;
        }

        body { 
            margin: 0; padding: 0; 
            font-family: 'Cairo', 'Inter', sans-serif; 
            background-color: #f7fafc; 
            min-height: 100vh;
            display: flex; flex-direction: column;
            direction: rtl !important; 
        }

        .mobile-container { 
            width: 100%; 
            min-height: 100vh; 
            display: flex; flex-direction: column; 
            position: relative;
            flex-grow: 1;
        }

        header { 
            width: 100%; height: 70px; 
            background-color: var(--header-green); 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 0 15px;
            box-sizing: border-box;
            position: sticky; 
            top: 0; z-index: 1000;
            direction: rtl !important;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .header-content {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        @media (min-width: 481px) {
            .header-content {
                max-width: 100%;
                padding: 0 40px;
            }
        }

        .brand-section { display: flex; align-items: center; flex-direction: row !important; }
        .logo-img { height: 35px; width: auto; display: block; }
        .v-line { width: 1px; height: 30px; background-color: rgba(0,0,0,0.1); margin: 0 12px; }
        
        .title-box { display: flex; flex-direction: column; text-align: right !important; }
        .title-box span:first-child { font-size: 11px; font-weight: 800; color: #1a202c; margin-bottom: 2px; letter-spacing: 0px; }
        .title-box span:last-child { font-size: 9px; font-weight: 600; color: #64748b; letter-spacing: 0px; }

        .info-display-wrapper { 
            display: flex; align-items: center; background: #f1f5f9; 
            border: 1px solid #e2e8f0; border-radius: 8px; 
            padding: 0 10px; height: 40px; cursor: pointer;
            box-sizing: border-box; gap: 8px; flex-direction: row !important;
        }
        .display-text { font-size: 11px; font-weight: 700; color: #1e293b; display: flex; align-items: center; gap: 5px; flex-direction: row !important; white-space: nowrap; }
        .nav-icon { width: 22px; height: 22px; fill: #1e293b !important; display: block; flex-shrink: 0; }

        .login-bar {
            width: 100%; background-color: var(--login-bg);
            padding: 15px 0; box-sizing: border-box;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .ticker-wrap {
            width: 100%;
            overflow: hidden;
        }

        .ticker-move {
            display: flex;
            width: 100%;
            justify-content: space-around;
        }

        .ticker-item {
            display: flex;
            align-items: center;
            gap: 15px;
            color: white;
            white-space: nowrap;
        }

        .ticker-icon {
            width: 24px;
            height: 24px;
            fill: white;
            flex-shrink: 0;
            position: relative;
        }

        .counter-badge {
            font-size: 11px;
            font-weight: 800;
            margin-left: -10px;
            margin-right: 5px;
            background: rgba(255,255,255,0.2);
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
            min-width: 60px;
            text-align: center;
        }

        .login-sticky-sheet {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 24px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 28px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.05);
            margin: 20px auto;
        }

        .auth-flex-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            align-items: center;
            gap: 12px;
        }

        .sheet-header-text {
            font-size: 20px;
            font-weight: 800;
            color: #000000;
            text-align: center;
            margin: 0;
            margin-bottom: 5px;
        }

        .email-auth-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 10px;
        }

        .auth-input {
            width: 100%;
            height: 52px;
            border-radius: 14px;
            border: 1.5px solid #e2e8f0;
            padding: 0 18px;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            background: #f8fafc;
        }

        /* تم تغيير تأثير التركيز إلى الأزرق */
        .auth-input:focus {
            border-color: var(--accent-blue);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(0, 149, 246, 0.1);
        }

        .auth-btn {
            border-radius: 14px; 
            height: 52px;
            padding: 0 20px;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            border: none;
            font-size: 15px; 
            font-weight: 700; 
        }

        .email-btn {
            background-color: var(--accent-blue);
            color: white;
            margin-top: 5px;
            box-shadow: 0 4px 12px rgba(0, 149, 246, 0.2);
        }

        .google-btn {
            background-color: #f2f2f2; 
            color: #000000;
        }
        
        .apple-btn {
            background-color: #000000;
            color: #ffffff;
        }

        .auth-btn:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        .toggle-auth-wrapper {
            margin-top: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .toggle-text {
            font-size: 13px;
            color: #64748b;
            font-weight: 600;
        }

        /* تم تغيير لون الرابط التفاعلي للأزرق */
        .toggle-auth-mode {
            font-size: 14px;
            color: var(--accent-blue);
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .divider {
            width: 100%;
            display: flex;
            align-items: center;
            text-align: center;
            color: #94a3b8;
            font-size: 11px;
            margin: 10px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }
        .divider:not(:empty)::before { margin-left: .5em; }
        .divider:not(:empty)::after { margin-right: .5em; }

        .platforms-wrapper { background-color: var(--platform-bg); padding: 25px 0; }
        .section-header { text-align: center; padding: 0 20px 20px 20px; }
        .section-title { font-size: 16px; font-weight: 800; color: #1e293b; margin-bottom: 6px; }
        /* تم تغيير لون النص الترويجي للأزرق */
        .section-subtitle { font-size: 12px; font-weight: 600; color: var(--accent-blue); }

        .platforms-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
            padding: 0 20px; max-width: 600px; margin: 0 auto;
        }
        .platform-box {
            background: #ffffff; border-radius: 18px; padding: 18px 5px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #f1f5f9;
            transition: transform 0.2s; text-decoration: none; cursor: pointer;
        }
        .platform-box:active { transform: scale(0.92); }
        .p-img { width: 40px; height: 40px; object-fit: contain; }
        .p-svg { width: 36px; height: 36px; }
        .platform-name { font-size: 11px; font-weight: 700; color: #334155; }

        .selection-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 9999; justify-content: center; align-items: flex-end;
        }
        
        @media (min-width: 768px) {
            .selection-overlay {
                align-items: center;
            }
            .selection-sheet {
                width: 90%;
                max-width: 400px;
                border-radius: 20px !important;
                height: 70vh !important;
            }
        }

        .selection-sheet {
            width: 100%; max-width: 500px; background: white; border-radius: 24px 24px 0 0; 
            padding: 24px; box-sizing: border-box; height: 50vh; overflow-y: auto;
        }
        .option-item { padding: 18px; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .flag-container { display: flex; align-items: center; margin-right: 15px; }
        .icon-dark { width: 24px; height: 24px; fill: #64748b; }
    </style>
</head>

    <script>
        let isSignUpMode = false;
        function toggleAuthMode() {
            const lang = localStorage.getItem('pref_lang') || 'ar';
            isSignUpMode = !isSignUpMode;
            const usernameInput = document.getElementById('auth-username');
            const confirmPassInput = document.getElementById('auth-confirm-password');
            const actionBtn = document.getElementById('email-action-btn');
            const toggleBtn = document.getElementById('toggle-auth-mode');
            const toggleHint = document.getElementById('toggle-hint');
            const sheetTitle = document.getElementById('sheet-title');
            
            if(isSignUpMode) {
                usernameInput.style.display = "block";
                confirmPassInput.style.display = "block";
                sheetTitle.innerText = lang === 'ar' ? "إنشاء حساب" : "Sign Up";
                actionBtn.innerText = lang === 'ar' ? "إنشاء حساب" : "Sign Up";
                toggleHint.innerText = lang === 'ar' ? "هل لديك حساب؟" : "Have an account?";
                toggleBtn.innerText = lang === 'ar' ? "تسجيل الدخول" : "Log In";
            } else {
                usernameInput.style.display = "none";
                confirmPassInput.style.display = "none";
                sheetTitle.innerText = lang === 'ar' ? "تسجيل الدخول" : "Log In";
                actionBtn.innerText = lang === 'ar' ? "تسجيل الدخول" : "Log In";
                toggleHint.innerText = lang === 'ar' ? "ليس لديك حساب؟" : "Don't have an account?";
                toggleBtn.innerText = lang === 'ar' ? "إنشاء حساب جديد" : "Sign up";
            }
        }

        const stats = [
            { id: 'c1', current: 428.2, step: 0.1, suffix: 'k' },
            { id: 'c2', current: 1.254, step: 0.001, suffix: 'M' },
            { id: 'c3', current: 84.56, step: 0.05, suffix: 'k' },
            { id: 'c5', current: 2.412, step: 0.002, suffix: 'M' }
        ];

        function updateStats() {
            stats.forEach(s => {
                s.current += (Math.random() * s.step * 1.5);
                const el = document.getElementById(s.id);
                if(el) {
                    let display = s.suffix === 'M' ? s.current.toFixed(3) + 'M' : s.current.toFixed(1) + 'k';
                    el.innerText = display;
                }
            });
            setTimeout(updateStats, 500);
        }
        updateStats();

        const menaIcon = `<svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>`;
        const globeIcon = `<svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>`;

        const regionConfigs = [
            { id: 'mena', ar: "الشرق الأوسط", en: "MENA", type: 'icon', svg: menaIcon },
            { id: 'algeria', ar: "الجزائر", en: "Algeria", flag: 'https://flagcdn.com/dz.svg' },
            { id: 'egypt', ar: "مصر", en: "Egypt", flag: 'https://flagcdn.com/eg.svg' },
            { id: 'iraq', ar: "العراق", en: "Iraq", flag: 'https://flagcdn.com/iq.svg' },
            { id: 'morocco', ar: "المغرب", en: "Morocco", flag: 'https://flagcdn.com/ma.svg' },
            { id: 'saudi', ar: "السعودية", en: "Saudi Arabia", flag: 'https://flagcdn.com/sa.svg' },
            { id: 'other', ar: "منطقة أخرى", en: "Other Region", type: 'icon', svg: globeIcon }
        ];

        function openSelection() { renderRegions(); document.getElementById('overlay').style.display = 'flex'; }
        function closeSelection() { document.getElementById('overlay').style.display = 'none'; }

        function toggleLang() {
            const current = localStorage.getItem('pref_lang') || 'ar';
            localStorage.setItem('pref_lang', current === 'ar' ? 'en' : 'ar');
            updateUI(); renderRegions();
        }

        function renderRegions() {
            const lang = localStorage.getItem('pref_lang') || 'ar';
            const list = document.getElementById('regions-list');
            list.innerHTML = `<div class="option-item" style="background:#0095f6; color:white; border-radius:12px; margin-bottom:20px; justify-content:center; font-weight:800;" onclick="toggleLang()">
                ${lang === 'ar' ? 'تغيير إلى English' : 'Switch to Arabic'}
            </div>`;
            regionConfigs.forEach((reg, i) => {
                const div = document.createElement('div');
                div.className = 'option-item';
                div.onclick = () => { localStorage.setItem('pref_reg_idx', i); updateUI(); closeSelection(); };
                let iconMarkup = reg.type === 'icon' ? reg.svg.replace('nav-icon', 'icon-dark') : `<img src="${reg.flag}" style="width:28px; border-radius:3px; border:1px solid #eee;">`;
                div.innerHTML = `<span style="font-weight:600; color:#334155;">${reg[lang]}</span> <div class="flag-container">${iconMarkup}</div>`;
                list.appendChild(div);
            });
        }

        function updateUI() {
            const lang = localStorage.getItem('pref_lang') || 'ar';
            const regIdx = parseInt(localStorage.getItem('pref_reg_idx')) || 0;
            const reg = regionConfigs[regIdx];
            
            document.getElementById('label-lng').innerText = lang.toUpperCase();
            document.getElementById('label-reg').innerText = reg[lang];
            document.getElementById('flag-display').innerHTML = reg.type === 'icon' ? reg.svg : `<img src="${reg.flag}" class="nav-icon" style="width:24px; height:16px; border-radius:2px; object-fit:cover;">`;
            
            document.getElementById('google-btn-label').innerText = lang === 'ar' ? "متابعة باستخدام Google" : "Continue with Google";
            document.getElementById('apple-btn-label').innerText = lang === 'ar' ? "متابعة باستخدام Apple" : "Continue with Apple";
            
            const titleEl = document.getElementById('sheet-title');
            titleEl.innerText = !isSignUpMode ? (lang === 'ar' ? "تسجيل الدخول" : "Log In") : (lang === 'ar' ? "إنشاء حساب" : "Sign Up");
            
            const promo = {
                ar: { main: "اشتر مشتركي يوتيوب ومتابعي فيسبوك وإنستغرام", sub: "نمو سريع، حقيقي وبأفضل الأسعار!" },
                en: { main: "Buy YouTube, Facebook & Instagram Followers", sub: "Fast, real growth at best prices!" }
            };
            document.getElementById('promo-main').innerText = promo[lang].main;
            document.getElementById('promo-sub').innerText = promo[lang].sub;
        }
        updateUI();
    </script>
</body>
</html>

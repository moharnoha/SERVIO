        .exact-8-spinner div {
            position: absolute;

        .exact-8-spinner div:nth-child(3) { transform: rotate(90deg); animation-delay: -0.5s; }

        .exact-8-spinner div:nth-child(7) { transform: rotate(270deg); animation-delay: -0.1s; }
        .exact-8-spinner div:nth-child(8) { transform: rotate(315deg); animation-delay: 0s; }

        .region-select-box .chevron { color: #9ca3af; width: 24px; height: 24px; }

        import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBYNRiMneaU-d6FPMbCnjcWQBX4Tdg50zk", 
            authDomain: "serviocmm-a65ed.firebaseapp.com", 
            projectId: "serviocmm-a65ed",

            messagingSenderId: "975373759034", 
            appId: "1:975373759034:web:645cb5fb48772839453b03" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        async function saveUserToFirestore(user, customName = null, isNewUser = false) {
            const userRef = doc(db, "users", user.uid);

            if (isNewUser) {
                // إنشاء الحساب بناءً على قواعد Firestore Rules
                await setDoc(userRef, {
                    name: (customName || user.displayName || "User").trim(),
                    email: user.email,
                    balance: 0,
                    total_spend: 0,
                    uid: user.uid
                });
            }
            window.location.replace("dashboard/");
        }

        window.firebaseLogin = async (email, password) => {
            try {
                const res = await signInWithEmailAndPassword(auth, email, password);
                window.location.replace("dashboard/");
            } catch (e) {
                window.showAuthError(e.code);
            }
        };

        window.firebaseJoin = async (name, email, password) => {
            try {
                const res = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(res.user, { displayName: name });
                await saveUserToFirestore(res.user, name, true);
            } catch (e) {
                window.showAuthError(e.code);
            }
        };

        window.firebaseGoogle = async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                const userRef = doc(db, "users", result.user.uid);
                const docSnap = await getDoc(userRef);
                
                if (!docSnap.exists()) {
                    await saveUserToFirestore(result.user, null, true);
                } else {
                    window.location.replace("dashboard/");
                }
            } catch (e) {
                window.showAuthError(e.code);
            }
        };
    </script>

        function switchVideoNew(index) {
            if (isTransitioning) return;
            isTransitioning = true;
            currentIndexNew = index;
            const slides = document.querySelectorAll('.video-slide-new');
            const dots = document.querySelectorAll('.dot-new');
            slides.forEach(slide => slide.classList.remove('active'));
            dots.forEach(dot => dot.classList.remove('active'));
            if(slides[index]) slides[index].classList.add('active');
            if(dots[index]) dots[index].classList.add('active');
            
            if (index < 2) {
                playersNew.forEach((p, i) => {
                    if (i === index && p) { p.play().catch(() => {}); } 
                    else if(p) { p.pause().catch(() => {}); p.setCurrentTime(0).catch(() => {}); }
                });
            } else {
                playersNew.forEach(p => { if(p) { p.pause().catch(() => {}); p.setCurrentTime(0).catch(() => {}); } });
            }

                box.className = i === tempRegIdx ? 'option-box selected' : 'option-box';
                box.onclick = () => setTempReg(i);
                box.innerHTML = `<span>${reg[tempLang]}</span>` + (reg.type === 'icon' ? reg.svg : `<img src="${reg.flag}">`);
                container.appendChild(box);
            });
            const labels = { ar: { title_lang: "اللغة", title_reg: "المنطقة", lang: "اللغة", reg: "المنطقة", save: "حفظ" }, en: { title_lang: "Language", title_reg: "Region", lang: "Language", reg: "Region", save: "Save" } };
            const curL = labels[tempLang];
            document.getElementById('sheet-title-label-lang').innerText = curL.title_lang;
            document.getElementById('sheet-title-label-reg').innerText = curL.title_reg;
            document.getElementById('lang-section-label').innerText = curL.lang;
            document.getElementById('region-section-label').innerText = curL.reg;
            document.getElementById('save-btn-label-lang').innerText = curL.save;
            document.getElementById('save-btn-label-reg').innerText = curL.save;
        }

        function applyChanges(mode = 'lang') {
            document.getElementById('global-spinner-overlay').style.display = 'flex';
            setTimeout(() => {
                window.currentLang = tempLang;
                window.currentRegIdx = tempRegIdx;
                updateUI();
                if (document.getElementById('auth-modal').style.display === 'flex') {
                    const isJoin = document.querySelector('.auth-title').innerText.match(/Join|انضم/);
                    openAuthModal(isJoin ? 'join' : 'login');
                }
                closeSelection(mode);
                document.getElementById('global-spinner-overlay').style.display = 'none';
            }, 300);
        }

        function updateUI() {
            const lang = window.currentLang || 'en';
            document.documentElement.setAttribute('lang', lang);
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('label-lng').innerText = lang === 'ar' ? 'AR' : 'EN';
            
            const headerBox = document.getElementById('header-dynamic-title');
            if(lang === 'ar') {
                headerBox.innerHTML = `<span>مركز الخدمات</span><span>الرقمية</span>`;
            } else {
                headerBox.innerHTML = `<span>Digital Services</span><span>Center</span>`;
            }

            const translations = { ar: { hero: "المنصة الأكبر للمتابعين والخدمات في الشرق الأوسط", join: "انضم مجاناً", login: "تسجيل الدخول", legal: "باستخدام تطبيق serviocmm، فإنك توافق على <span>شروط الخدمة</span> وتقر بـ <span>سياسة الخصوصية</span> الخاصة بنا." }, en: { hero: "The Largest Platform for Followers & Services in MENA", join: "Join for free", login: "Log in", legal: "By using the serviocmm app, you agree to our <span>Terms of Service</span> and acknowledge our <span>Privacy Policy</span>." } };
            document.getElementById('hero-text-label').innerText = translations[lang].hero;
            document.querySelector('#btn-join-label span').innerText = translations[lang].join;
            document.querySelector('#btn-login-label span').innerText = translations[lang].login;
            document.getElementById('legal-label').innerHTML = translations[lang].legal;
        }

        function closeDialog() { document.getElementById('dialog-overlay').style.display = 'none'; }
        updateUI();
        initSlider();
    </script>
</body>
</html>

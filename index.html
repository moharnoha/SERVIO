<!DOCTYPE html>
<html lang="ar" dir="rtl" class="notranslate" translate="no"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>serviocmm - Final Version</title>
    <link rel="preconnect" href="https://player.vimeo.com">
    <link rel="preconnect" href="https://i.postimg.cc">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&family=Lexend:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --header-green: #FFFFFF; 
            --login-bg: #386E2C; 
            --google-section-bg: #EAF0E9; 
            --platform-bg: #F2F1F0;
            --garena-red: #386E2C;
            --success-green: #22c55e;
            --primary-green: #2F5822;
        }

        body { 
            margin: 0; padding: 0; 
            font-family: 'Cairo', 'Inter', sans-serif; 
            background-color: #F2F1F0; 
            min-height: 100vh;
            display: flex; flex-direction: column;
            direction: rtl !important; 
        }

        .mobile-container { 
            width: 100%; 
            min-height: 100vh; 
            display: flex; flex-direction: column; 
            position: relative;
            flex-grow: 1;
        }

        header { 
            width: 100%; height: 70px; 
            background-color: var(--header-green); 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 0 15px;
            box-sizing: border-box;
            position: sticky; 
            top: 0; z-index: 1000;
            direction: rtl !important;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .header-content {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        @media (min-width: 481px) {
            .header-content {
                max-width: 100%;
                padding: 0 40px;
            }
        }

        .brand-section { display: flex; align-items: center; flex-direction: row !important; }
        .logo-img { height: 35px; width: auto; display: block; }
        .v-line { width: 1px; height: 30px; background-color: rgba(0,0,0,0.1); margin: 0 12px; }
        
        .title-box { display: flex; flex-direction: column; text-align: right !important; }
        .title-box span { font-family: 'Cairo', 'Inter', sans-serif; letter-spacing: 0px; display: block; }
        .title-box span:first-child { font-size: 11px; font-weight: 800; color: #1a202c; margin-bottom: 0px; }
        .title-box span:last-child { font-size: 11px; font-weight: 800; color: #1a202c; }

        .header-left-group { display: flex; align-items: center; gap: 10px; flex-direction: row !important; }

        .info-display-wrapper { 
            display: flex; align-items: center; background: #F3F4F6; 
            border-radius: 20px; 
            padding: 4px 12px; height: 34px; cursor: pointer;
            box-sizing: border-box; gap: 6px; flex-direction: row !important;
            transition: background 0.2s;
        }
        .info-display-wrapper:active { background: #E5E7EB; }
        .display-text { font-size: 12px; font-weight: 700; color: #1e293b; display: flex; align-items: center; gap: 5px; flex-direction: row !important; white-space: nowrap; }
        .lang-globe-icon { width: 18px; height: 18px; fill: #64748b; }

        .profile-icon-svg {
            width: 28px; 
            height: 28px; 
            vertical-align: middle; 
            fill: #64748b; 
            overflow: hidden;
        }

        .exact-8-spinner {
            position: relative;
            width: 44px;
            height: 44px;
            transform: scale(0.6);
            display: none;
        }
        .exact-8-spinner div {
            position: absolute;
            width: 6px;
            height: 14px;
            background: #666;
            border-radius: 10px;
            left: 19px;
            top: 0;
            transform-origin: 3px 22px;
            animation: spinner-fade 0.8s linear infinite;
        }
        .exact-8-spinner div:nth-child(1) { transform: rotate(0deg); animation-delay: -0.7s; }
        .exact-8-spinner div:nth-child(2) { transform: rotate(45deg); animation-delay: -0.6s; }
        .exact-8-spinner div:nth-child(3) { transform: rotate(90deg); animation-delay: -0.5s; }
        .exact-8-spinner div:nth-child(4) { transform: rotate(135deg); animation-delay: -0.4s; }
        .exact-8-spinner div:nth-child(5) { transform: rotate(180deg); animation-delay: -0.3s; }
        .exact-8-spinner div:nth-child(6) { transform: rotate(225deg); animation-delay: -0.2s; }
        .exact-8-spinner div:nth-child(7) { transform: rotate(270deg); animation-delay: -0.1s; }
        .exact-8-spinner div:nth-child(8) { transform: rotate(315deg); animation-delay: 0s; }

        @keyframes spinner-fade {
            0% { background: #ffffff; opacity: 1; }
            100% { background: #666; opacity: 0.3; }
        }

        #global-spinner-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.7); z-index: 10002; justify-content: center; align-items: center;
        }
    </style>
</head>
<body class="notranslate">

    <div id="global-spinner-overlay">
        <div class="exact-8-spinner" style="display: block; transform: scale(1);">
            <div></div><div></div><div></div><div></div>
            <div></div><div></div><div></div><div></div>
        </div>
    </div>

    <div class="mobile-container">
        <header>
            <div class="header-content">
                <div class="brand-section">
                    <svg class="logo-img" viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg" style="height: 35px; width: auto;">
                        <defs>
                            <linearGradient id="deepGreenHeader" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#2d5a1e;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#1a3611;stop-opacity:1" />
                            </linearGradient>
                            <linearGradient id="vibrantGreenHeader" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#74a367;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#5a854f;stop-opacity:1" />
                            </linearGradient>
                            <mask id="whiteGapHeader">
                                <rect width="1000" height="800" fill="white" />
                                <circle cx="350" cy="400" r="362" fill="black" />
                            </mask>
                        </defs>
                        <circle cx="350" cy="400" r="350" fill="url(#deepGreenHeader)" />
                        <circle cx="650" cy="400" r="350" fill="url(#vibrantGreenHeader)" mask="url(#whiteGapHeader)" fill-opacity="0.95" />
                        <g transform="rotate(-38 500 400)">
                            <rect x="290" y="390" width="75" height="145" rx="37.5" fill="#FFFFFF" />
                            <rect x="425" y="80" width="155" height="640" rx="77.5" fill="#FFFFFF" />
                            <rect x="640" y="445" width="75" height="145" rx="37.5" fill="#FFFFFF" />
                        </g>
                    </svg>
                    <div class="v-line"></div>
                    <div class="title-box" id="header-dynamic-title">
                        <span>Digital Services</span>
                        <span>Center</span>
                    </div>
                </div>
                <div class="header-left-group">
                    <div class="info-display-wrapper">
                        <svg class="lang-globe-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                        <div class="display-text">
                            <span id="label-lng">EN</span>
                        </div>
                    </div>
                    <svg class="profile-icon-svg" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <clipPath id="circleView">
                                <circle cx="512" cy="512" r="512" />
                            </clipPath>
                        </defs>
                        <circle cx="512" cy="512" r="512" fill="#f0f0f0" />
                        <g clip-path="url(#circleView)">
                            <circle cx="512" cy="380" r="170.7" />
                            <path d="M100 880c0-140 150-200 412-200s412 60 412 200v150H100V880z" />
                        </g>
                    </svg>
                </div>
            </div>
        </header>
    </div>

</body>
</html>
